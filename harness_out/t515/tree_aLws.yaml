# VARIANT (harness only, 29.09 T-515 aLws) — NOT the live tree
# config/decision_tree_v3.yaml — DECISION_TREE_V3: the one nested decision tree (Michael 25.09 12:10:
# "עץ ההחלטות שלנו צריך להיות בשלבים: קודם סוג פתיחה, סוג היום, תבנית מתאימה… הענפים של כל מערכת
#  אנחנו צריכים לפצל כדי לדייק למצב בפועל. ממש צריך להיות עץ! ולא טבלה שפועלת").
#
# ORDER OF THE QUESTIONS (fixed, the doctrine's order — Dalton: opening → structure → day type;
# Zohar: pattern → location → volume):
#   opening_type → phase → day_type → [structure] → pattern / kind → circumstance splits
#   (direction · rel_bias · zone · edge · test · volume · delta · R_atr · hour)
# Every node asks ONE question ("split") and has ONE branch per answer ("branches"); "*" is the
# default branch; "A|B" lists several answers. A leaf is an explicit ACTION — never a score:
#   TAKE   — admit to the safety gates (R:R floor, slot, EOD, position) with this stop/target policy
#   SHADOW — record only (metadata.shadow_only)
#   SKIP   — refuse; blocked_by = tree:<id>
# `measured:` on a leaf = {n, win, usd, source, date} written by scripts/tree_measure.py — the number
# never decides by itself; it confirms or refutes a doctrinal split (LEARNING_DOCTRINE 09.09).
#
# FEATURES (backend/v9/services/decision_tree.py::features_of_setup — all computed by the gateway
# from what it already knows, no look-ahead):
#   opening_type  OPEN_DRIVE · OPEN_TEST_DRIVE · OPEN_REJECTION_REVERSE · OPEN_AUCTION_IN · OPEN_AUCTION_OUT · UNKNOWN
#   phase         A 16:30–16:45 · B –17:30 · C –21:00 · D 21:00+ (IL)
#   day_type      the live label (post-hysteresis): Trend_Normal · Trend_DD · Variation · Normal_Variation ·
#                 Normal · Neutral_Center · Neutral_Extreme · Nontrend · Nonconviction · FORMING
#   structure     what the price DID vs the completed IB: forming (phase A/B) · none · up · down · two_sided
#   pattern       the producer's classification (OPENING_DRIVE, REACTIVE_SHORT, GB100, CEILING_FLIP_LONG, VAR_CONT…)
#   kind          entry kind of the pattern (dalton_playbook.entry_kind_map): WITH_DRIVE · REVERSAL · EDGE_FADE ·
#                 PULLBACK · BREAK · VALUE_RETURN
#   direction     LONG · SHORT
#   rel_bias      the setup's direction vs the session's directional hint (opening direction, then the IB
#                 extension from 17:30): with · against · none (no hint)
#   zone          entry (or the pattern's anchor when the entry is still within 2×tol of it) vs today's value
#                 area: above_value · near_vah · mid_value · near_val · below_value · unknown (no VA yet)
#   edge          failed_extension (T-329: a CONFIRMED double at the extension extreme — the extension
#                 failing) · none
#   R_atr, hour, volume, delta, test — available for splits, unused by the seed
#
# SEED = PARITY (milestone 1, plan §3): this tree encodes exactly today's live behaviour
# (dalton_playbook.yaml phases A–D · kinds_apply_to=counter_bias_only · phase_d=manage_only ·
# T-319b location rule · T-329 failed-extension exemption). The 58-session harness with
# DECISION_TREE_V3=1 must equal the baseline before any split is added. From there every
# split is a branch with `measured:` and a day-total replay (Michael 24.09: positive ⇒ live).

version: "3.1.0"
seeded_from: "dalton_playbook.yaml (09.09) · auth_matrix (T-319b location) · T-329 · 25.09 parity · 27.09 package S1+S5+S7 (T-494)"

# ── library of shared sub-trees (YAML anchors; the loader reads only `root`) ────────────────────
library:
  # 27.09 package (T-494): three splits that passed alone, replayed TOGETHER vs the live tree before going live
  # (config/decision_tree_v3.splits.yaml S1/S5/S7/PKG; harness_out/t494/README_variants.txt).
  ruling_pkg_2709: &ruling_pkg_2709 "Michael 2026-09-27 18:37 IL 'מאשר' (Cowork) — the package S1+S5+S7 of the 27.09 night report (docs/reports/NIGHT_REPORT_2026-09-27.md §5); S1 amends the 17.09 phase-D 'manage only' ruling"
  package_2709: &package_2709 "t494pkg (S1+S5+S7 together) vs live0927, 60 sessions: Δ +470.55$ gross / ≈ +387.35$ net of +32 round-trips · better 24 / worse 12 · max DD −277.50$ (live −212.50$)"
  skip_stand_down: &skip_stand_down
    leaf: SKIP
    id: stand_down
    note: "no doctrine row for this circumstance — stand down"
  skip_bias: &skip_bias
    leaf: SKIP
    id: bias
    note: "against the session's directional hint"
  skip_kind: &skip_kind
    leaf: SKIP
    id: kind
    note: "entry kind not in this row's list (bias BOTH)"
  skip_location: &skip_location
    leaf: SKIP
    id: location
    note: "responsive day: LONG only near/below VAL, SHORT only near/above VAH (T-319b)"
  take_with_hint: &take_with_hint
    leaf: TAKE
    note: "with the directional hint — any kind (kinds_apply_to=counter_bias_only)"
  take_failed_ext: &take_failed_ext
    leaf: TAKE
    # S7 (T-494): the ladder from the producer's own stop — the structural chain cut T1 to an old shelf here and
    # rr_entry_gate refused winners (9 · 78% · +510$ candidate-level)
    exit: {t1_r: 1.5, t2_r: 2.5}
    ruling: *ruling_pkg_2709
    measured: {sessions: 60, usd: 166.25, usd_net: 163.65, better: 11, worse: 8, source: "harness_out/t466/t494s7 vs live0927 (S7 = this leaf + the BREAK kinds leaves)", date: "2026-09-27", package: *package_2709, rule: "re-measure nightly; report if Σ turns negative"}
    note: "T-329: confirmed double at the extension extreme negates the bias"
  take_location: &take_location
    leaf: TAKE
    id: take_location        # the gateway marks location_checked on this leaf (EDGE_FADE_TARGETS_V1 parity)
    note: "responsive entry at the value edge (T-319b) — kinds skipped"

  # after a kind mismatch: only the failed-extension flip is still admitted
  kind_fallback: &kind_fallback
    split: edge
    branches:
      failed_extension: *take_failed_ext
      "*": *skip_kind
  against_fallback: &against_fallback
    split: edge
    branches:
      failed_extension: *take_failed_ext
      "*": *skip_bias

  # kinds lists per row (bias BOTH or no hint ⇒ the list decides)
  kinds_drive_A: &kinds_drive_A
    split: kind
    branches:
      WITH_DRIVE: {leaf: TAKE, note: "phase A: with-drive entries only"}
      "*": *kind_fallback
  kinds_drive_B: &kinds_drive_B
    split: kind
    branches:
      WITH_DRIVE|PULLBACK: {leaf: TAKE, note: "phase B drive: with-drive + pullback"}
      "*": *kind_fallback
  kinds_orr_B: &kinds_orr_B
    split: kind
    branches:
      REVERSAL|PULLBACK: {leaf: TAKE, note: "phase B rejection-reverse: reversal + pullback"}
      "*": *kind_fallback
  kinds_auction_B: &kinds_auction_B
    split: kind
    branches:
      EDGE_FADE: {leaf: TAKE, note: "phase B open-auction: edge fades only"}
      # S5 (T-494): a reversal at the opening extreme (DALTON_EDGE / OPENING_EXTREME_REJECT / ORR) — kind refusals
      # FORMING/REVERSAL 19 · +529$ · Trend_Normal/REVERSAL 13 · +419$ candidate-level
      REVERSAL:
        leaf: TAKE
        id: auction_B_reversal
        ruling: *ruling_pkg_2709
        measured: {n: 25, win: 52, usd: 105.55, usd_net: 69.15, sessions: 60, better: 9, worse: 9, source: "harness_out/t466/t494s5 vs live0927", date: "2026-09-27", package: *package_2709, rule: "thin (Aug −232$) — re-measure nightly; report if Σ turns negative"}
        note: "phase B open-auction: a reversal at the opening extreme is taken too"
      "*": *kind_fallback
  kinds_trend: &kinds_trend
    split: kind
    branches:
      PULLBACK|BREAK:
        leaf: TAKE
        exit: {t1_r: 1.5, t2_r: 2.5}      # S7 (T-494) — see take_failed_ext
        ruling: *ruling_pkg_2709
        measured: {sessions: 60, usd: 166.25, usd_net: 163.65, better: 11, worse: 8, source: "harness_out/t466/t494s7 vs live0927", date: "2026-09-27", package: *package_2709, rule: "re-measure nightly"}
        note: "trend day: pullback / break (with the trend when hinted)"
      "*": *kind_fallback
  kinds_variation: &kinds_variation
    split: kind
    branches:
      BREAK|VALUE_RETURN:
        leaf: TAKE
        exit: {t1_r: 1.5, t2_r: 2.5}      # S7 (T-494) — see take_failed_ext
        ruling: *ruling_pkg_2709
        measured: {sessions: 60, usd: 166.25, usd_net: 163.65, better: 11, worse: 8, source: "harness_out/t466/t494s7 vs live0927", date: "2026-09-27", package: *package_2709, rule: "re-measure nightly"}
        note: "variation day: break / value return"
      "*": *kind_fallback
  kinds_normal: &kinds_normal
    split: kind
    branches:
      EDGE_FADE|VALUE_RETURN: {leaf: TAKE, note: "normal day, no VA yet: edge fade / value return"}
      "*": *kind_fallback
  kinds_neutral: &kinds_neutral
    split: kind
    branches:
      EDGE_FADE: {leaf: TAKE, note: "neutral day, no VA yet: edge fades only"}
      "*": *kind_fallback

  # directional row: with the hint → any kind · against → refused (unless failed extension) · no hint → kinds
  drive_A: &drive_A
    split: rel_bias
    branches:
      with: *take_with_hint
      against: *against_fallback
      "*": *kinds_drive_A
  drive_B: &drive_B
    split: rel_bias
    branches:
      with: *take_with_hint
      against: *against_fallback
      "*": *kinds_drive_B
  orr_B: &orr_B
    split: rel_bias
    branches:
      with: *take_with_hint
      against: *against_fallback
      "*": *kinds_orr_B
  trend_row: &trend_row
    split: rel_bias
    branches:
      with: *take_with_hint
      against: *against_fallback
      "*": *kinds_trend
  variation_row: &variation_row
    split: pattern
    branches:
      VAR_CONT:            # T-458א producer (flag VAR_CONT_V1, measured Δ+16$ net ⇒ OFF): kinds/location skipped, bias kept
        split: rel_bias
        branches:
          against: *skip_bias
          "*": {leaf: TAKE, note: "VAR_CONT: structural pullback-continuation with the extension"}
      "*":
        split: rel_bias
        branches:
          with: *take_with_hint
          against: *against_fallback
          "*": *kinds_variation

  # responsive rows (Normal / Neutral, phase C): location decides; no VA yet → kinds
  responsive_normal: &responsive_normal
    split: direction
    branches:
      LONG:
        split: zone
        branches:
          near_val|below_value: *take_location
          unknown: *kinds_normal
          "*": *skip_location
      SHORT:
        split: zone
        branches:
          near_vah|above_value: *take_location
          unknown: *kinds_normal
          "*": *skip_location
      "*": *skip_stand_down
  responsive_neutral: &responsive_neutral
    split: direction
    branches:
      LONG:
        split: zone
        branches:
          near_val|below_value: *take_location
          unknown: *kinds_neutral
          "*": *skip_location
      SHORT:
        split: zone
        branches:
          near_vah|above_value: *take_location
          unknown: *kinds_neutral
          "*": *skip_location
      "*": *skip_stand_down

  # a provisional Normal/Neutral label in phase A/B (the label flows pre-lock, T-47/F6): the T-319b
  # location rule runs first; approved ⇒ kinds skipped, the row's bias still applies (written out
  # per opening type under `root` below)
  loc_ok_then_bias: &loc_ok_then_bias
    split: rel_bias
    branches:
      against: *against_fallback
      "*": *take_location

  # ── the price decides before the label (Michael 25.09 19:05: "בכלל זה כבר לא יום נורמלי — איפה המערכת?").
  # 25.09: IB 7752.75–7793.75, the label stayed "Normal" while price broke the IB high to 7805.75 on the
  # day's biggest delta (+3,752 / +3,102) — and the tree refused EVERY long 18:10–19:00 with `location`
  # (Normal = responsive only). Dalton: a Normal day is a day the IB contains; once the IB is extended
  # one-sidedly the day IS a Normal-Variation day — trade WITH the extension, fade only its failure.
  # So under a Normal label the tree now asks first what the price did to the IB (`structure`):
  #   none      → the Normal template: sell VAH / buy VAL (T-319b location rule), target the middle
  #   up | down → the extension template: WITH the extension = TAKE (beyond value is the thesis ⇒ the
  #               ELQ "beyond value / chaser" gate does not apply on this leaf); AGAINST it only the
  #               failed-extension flip (T-329); no directional hint ⇒ the Variation kinds
  #   two_sided → the Neutral template: fade both extremes
  # Measured as T-466 (the same relabel, 58 sessions): Δ −85$ ≈ −1.5$/day — neutral; ruled live by
  # Michael 25.09 19:05 ("אני רוצה את זה על לייב … מתוקן עכשיו כולל הכל וריסטארט"). Re-measured nightly.
  take_with_extension: &take_with_extension
    leaf: TAKE
    id: take_with_extension
    skip_gates: [entry_location_quality]
    ruling: "Michael 2026-09-25 19:05 — 'אני רוצה את זה על לייב ואני רוצה את זה מתוקן עכשיו כולל הכל וריסטארט' (the tree must fire with the day, not by a lagging label)"
    measured: {n: 58, usd: -85.0, sessions: 58, source: "T-466 STRUCTURE_BEFORE_LABEL (same relabel) harness_out/t466/sbl vs baseline", date: "2026-09-24", rule: "ruled live; re-measure nightly with the leaf's own gate policy"}
    note: "the IB is extended one-sidedly — the day is Normal-Variation by price; with the extension any kind is taken"
  extension_row: &extension_row
    split: rel_bias
    branches:
      with: *take_with_extension
      against: *against_fallback
      "*": *kinds_variation
  normal_by_structure: &normal_by_structure
    split: structure
    branches:
      up|down: *extension_row
      two_sided: *responsive_neutral
      "*": *responsive_normal

  # phase C — by day type (opening type no longer decides; Dalton: the IB and the extension do)
  phase_C: &phase_C
    split: day_type
    branches:
      Trend_Normal|Trend_DD: *trend_row
      Variation|Normal_Variation: *variation_row
      Normal: *normal_by_structure
      Neutral_Center|Neutral_Extreme: *responsive_neutral
      Nontrend|Nonconviction: *skip_stand_down
      "*": *skip_stand_down
  # S1 (T-494, ruled 27.09): phase D on a day the IB extended one-sidedly — WITH the extension, 21:00 until the
  # 22:15 EOD cutoff (Dalton: a Variation day that holds its extension into the afternoon). Stand-down refusals
  # (D,Variation,none,with) 21 · 90% · +1,298$ candidate-level on 3 days; the day total decided.
  # ⚠️ DEPENDS ON THE GATES AFTER IT: in the package replay this leaf admits 291 unique candidates, 39% at 1.5R,
  # −2,428$ candidate-level — eod_entry_cutoff holds back 83 (−1,100$) and rr_entry_gate 29 (−713$); the day-total
  # gain comes from the ~19 that execute. Re-measure S1 BEFORE loosening eod_entry_cutoff or rr_entry_gate.
  d_with_extension: &d_with_extension
    split: rel_bias
    branches:
      with:
        leaf: TAKE
        id: d_with_extension
        ruling: *ruling_pkg_2709
        measured: {n: 19, win: 63, usd: 160.0, usd_net: 110.6, sessions: 60, better: 9, worse: 7, source: "harness_out/t466/t494s1 vs live0927 (+19 trades, 0 displaced)", date: "2026-09-27", package: *package_2709, rule: "re-measure nightly; report if Σ turns negative"}
        note: "phase D, the IB extended one-sidedly — with the extension (the EOD cutoff at 22:15 still applies)"
      "*": *skip_stand_down
  # phase D — manage only, except with-trend on trend days / with-extension on Neutral_Extreme (Michael 17.09 14:05)
  #   + with the extension on Variation / on a Normal label whose IB was extended (S1, Michael 27.09 'מאשר')
  phase_D: &phase_D
    split: day_type
    branches:
      Trend_Normal|Trend_DD|Neutral_Extreme: *trend_row
      Variation|Normal_Variation: *d_with_extension
      Normal:
        split: structure
        branches:
          up|down: *d_with_extension
          "*": *skip_stand_down
      "*": *skip_stand_down

# ── the tree ────────────────────────────────────────────────────────────────────────────────────
root_legacy: &root_legacy
  split: opening_type
  branches:

    OPEN_DRIVE:
      split: phase
      branches:
        A:
          split: day_type
          branches:
            Normal|Neutral_Center|Neutral_Extreme:
              split: direction
              branches:
                LONG:
                  split: zone
                  branches:
                    near_val|below_value: *loc_ok_then_bias
                    unknown: *drive_A
                    "*": *skip_location
                SHORT:
                  split: zone
                  branches:
                    near_vah|above_value: *loc_ok_then_bias
                    unknown: *drive_A
                    "*": *skip_location
                "*": *skip_stand_down
            "*": *drive_A
        B:
          split: day_type
          branches:
            Normal|Neutral_Center|Neutral_Extreme:
              split: direction
              branches:
                LONG:
                  split: zone
                  branches:
                    near_val|below_value: *loc_ok_then_bias
                    unknown: *drive_B
                    "*": *skip_location
                SHORT:
                  split: zone
                  branches:
                    near_vah|above_value: *loc_ok_then_bias
                    unknown: *drive_B
                    "*": *skip_location
                "*": *skip_stand_down
            "*": *drive_B
        C: *phase_C
        D: *phase_D

    OPEN_TEST_DRIVE:
      split: phase
      branches:
        A:
          split: day_type
          branches:
            Normal|Neutral_Center|Neutral_Extreme:
              split: direction
              branches:
                LONG:
                  split: zone
                  branches:
                    near_val|below_value: *skip_stand_down     # phase A has no test-drive row: stand-down wins
                    unknown: *skip_stand_down
                    "*": *skip_location
                SHORT:
                  split: zone
                  branches:
                    near_vah|above_value: *skip_stand_down
                    unknown: *skip_stand_down
                    "*": *skip_location
                "*": *skip_stand_down
            "*": *skip_stand_down
        B:
          split: day_type
          branches:
            Normal|Neutral_Center|Neutral_Extreme:
              split: direction
              branches:
                LONG:
                  split: zone
                  branches:
                    near_val|below_value: *loc_ok_then_bias
                    unknown: *drive_B
                    "*": *skip_location
                SHORT:
                  split: zone
                  branches:
                    near_vah|above_value: *loc_ok_then_bias
                    unknown: *drive_B
                    "*": *skip_location
                "*": *skip_stand_down
            "*": *drive_B
        C: *phase_C
        D: *phase_D

    OPEN_REJECTION_REVERSE:
      split: phase
      branches:
        A:
          split: day_type
          branches:
            Normal|Neutral_Center|Neutral_Extreme:
              split: direction
              branches:
                LONG:
                  split: zone
                  branches:
                    near_val|below_value: *skip_stand_down
                    unknown: *skip_stand_down
                    "*": *skip_location
                SHORT:
                  split: zone
                  branches:
                    near_vah|above_value: *skip_stand_down
                    unknown: *skip_stand_down
                    "*": *skip_location
                "*": *skip_stand_down
            "*": *skip_stand_down
        B:
          split: day_type
          branches:
            Normal|Neutral_Center|Neutral_Extreme:
              split: direction
              branches:
                LONG:
                  split: zone
                  branches:
                    near_val|below_value: *loc_ok_then_bias
                    unknown: *orr_B
                    "*": *skip_location
                SHORT:
                  split: zone
                  branches:
                    near_vah|above_value: *loc_ok_then_bias
                    unknown: *orr_B
                    "*": *skip_location
                "*": *skip_stand_down
            "*": *orr_B
        C: *phase_C
        D: *phase_D

    OPEN_AUCTION_IN|OPEN_AUCTION_OUT:
      split: phase
      branches:
        A:
          split: day_type
          branches:
            Normal|Neutral_Center|Neutral_Extreme:
              split: direction
              branches:
                LONG:
                  split: zone
                  branches:
                    near_val|below_value: *skip_stand_down
                    unknown: *skip_stand_down
                    "*": *skip_location
                SHORT:
                  split: zone
                  branches:
                    near_vah|above_value: *skip_stand_down
                    unknown: *skip_stand_down
                    "*": *skip_location
                "*": *skip_stand_down
            "*": *skip_stand_down
        B:
          split: day_type
          branches:
            Normal|Neutral_Center|Neutral_Extreme:
              split: direction
              branches:
                LONG:
                  split: zone
                  branches:
                    near_val|below_value: *take_location        # bias BOTH on the auction row
                    unknown: *kinds_auction_B
                    "*": *skip_location
                SHORT:
                  split: zone
                  branches:
                    near_vah|above_value: *take_location
                    unknown: *kinds_auction_B
                    "*": *skip_location
                "*": *skip_stand_down
            # ── split V2 (T-480, 25.09): the first hour already reads TREND while the opening was an
            # auction — Dalton: the IB being extended one-sidedly in the first hour is the tell of a
            # potential trend day, and initiative (BREAK) activity is then WITH the developing structure.
            # Day-total replay, 58 sessions: Δ +101.25$ gross / +83$ net on 8 trades (6 wins) — positive
            # but under-sampled (< 15); was SHADOW. RULED TAKE by Michael 25.09 14:11:49Z "כן" [56436c0f]
            # (T-484) — his explicit answer to "enable it live today despite 8 trades vs the 15 floor?";
            # the ruling overrides the n≥15 rule written here. Standing until he revokes it.
            # (V3b = the same with a Variation label: Δ +86$ — the Variation part is negative ⇒ not added.)
            Trend_Normal|Trend_DD:
              split: kind
              branches:
                BREAK:
                  leaf: TAKE
                  id: auction_B_trend_break
                  note: "open-auction whose first hour already reads Trend — initiative BREAK with the developing structure (split V2; ruled live by Michael 25.09 T-484)"
                  ruling: "Michael 2026-09-25 14:11:49Z 'כן' [56436c0f] — T-484: live today despite n=8 < 15"
                  measured: {n: 8, win: 75, usd: 101.25, usd_net: 83.05, sessions: 58, better: 5, worse: 2, source: "harness_out/t466/t3v2 vs t458 baseline", date: "2026-09-25", rule: "ruled TAKE (T-484); re-measure nightly, report if Σ turns negative"}
                "*": *kinds_auction_B
            "*": *kinds_auction_B
        C: *phase_C
        D: *phase_D

    "*":     # UNKNOWN / not yet classified opening
      split: phase
      branches:
        A:
          split: day_type
          branches:
            Normal|Neutral_Center|Neutral_Extreme:
              split: direction
              branches:
                LONG:
                  split: zone
                  branches:
                    near_val|below_value: *skip_stand_down
                    unknown: *skip_stand_down
                    "*": *skip_location
                SHORT:
                  split: zone
                  branches:
                    near_vah|above_value: *skip_stand_down
                    unknown: *skip_stand_down
                    "*": *skip_location
                "*": *skip_stand_down
            "*": *skip_stand_down
        B:
          split: day_type
          branches:
            Normal|Neutral_Center|Neutral_Extreme:
              split: direction
              branches:
                LONG:
                  split: zone
                  branches:
                    near_val|below_value: *skip_stand_down
                    unknown: *skip_stand_down
                    "*": *skip_location
                SHORT:
                  split: zone
                  branches:
                    near_vah|above_value: *skip_stand_down
                    unknown: *skip_stand_down
                    "*": *skip_location
                "*": *skip_stand_down
            "*": *skip_stand_down
        C: *phase_C
        D: *phase_D

# T-515: the turn is asked FIRST — what the market shows right now
root:
  split: turn_rel
  branches:
    against:
      split: direction
      branches:
        LONG: {leaf: SKIP, id: against_turn_long, note: "T-515: no long after the double top"}
        "*": *root_legacy
    with:
      split: direction
      branches:
        SHORT: {leaf: TAKE, id: with_turn_short, promote: [CEILING_FLIP_TOUCH2, ZLR], note: "T-515: short after the double top"}
        "*": *root_legacy
    "*": *root_legacy
