    status: awaiting_ruling
    ref: "CURSOR_DALTON_GAPS_2026-07-26 gap-4 · built cowork 07-25 · 6 tests"
  MANUAL_POSITION_GUARD_V1:
    category: risk
    what: "Alert-only naked-stop watch on Michael's MANUAL position (the reconciler ownership branch): no working protective stop for >= MANUAL_GUARD_GRACE_S (60s) -> CRITICAL log + phone push, re-alert every MANUAL_GUARD_REALERT_S (300s). Stop detection by Sierra order type (2/3=stop, 1=limit; price-agnostic — covers locked-profit stops), price-vs-avg fallback for typeless feeds, unknown -> silent (Rule 1). NEVER places/modifies orders — the 12:20 ownership ruling fully preserved."
    why: "ENABLED 07-25 per Michael ruling same day ('התראה-בלבד' chosen from 3 options). Closes the gap: manual naked entries had zero watch after the ownership fix. 12 tests."
    status: enabled
    ref: "RULED מייקל 07-25 · built+enabled cowork 07-25 · sierra_position_reconciler.py"

