mds_version: "1.0.2"
created: "2026-05-02"
status: "Focused grid — filters > weights"
architecture: "Option C + Multi-Target Retro + Sequential Filter"

# Continuous dimensions (narrower — weights matter less per forensics)
continuous:
  threshold:
    range: [30, 60]
    description: "Score gate — narrowed from [25,75]"

# Discrete weight values (not continuous — just 3 per dimension)
discrete:
  vegas_weight:
    values: [25, 30, 35]
    description: "Vegas component (V1=30)"
  tpo_weight:
    values: [20, 25, 30]
    description: "TPO component (V1=25)"
  fvg_weight:
    values: [20, 25, 30]
    description: "FVG component (V1=25)"

# Categorical dimensions (FULL sweep — this is the lever)
categorical:
  footprint_logic:
    values: ["weighted", "veto", "off"]
  day_filter:
    values:
      - "all_days"
      - "skip_DEVELOPING"
      - "skip_DEVELOPING_NEUTRAL"
      - "TREND_only"
      - "TREND_GAP_only"
  direction_filter:
    values: ["both", "SHORT_only"]
  skip_overextended:
    values: [false, true]

# Fixed
fixed:
  duration_max_minutes: 720
  duration_penalty_factor: 0.0
  footprint_weight: 20

# Constraints
constraints:
  - "vegas_weight + tpo_weight + fvg_weight <= 105"
  - "vegas_weight + tpo_weight + fvg_weight >= 60"

# Composite score
composite_score:
  hard_penalties:
    win_rate_min: 0.50
    profit_factor_min: 1.20
    n_trades_min: 20
    max_drawdown_max: 3000
  soft_weights:
    base_pnl_weight: 1.0
    drawdown_penalty: 0.5
    profit_factor_bonus: 100

# Baselines
baselines:
  v1_production:
    threshold: 50
    vegas_weight: 30
    tpo_weight: 25
    fvg_weight: 25
    footprint_weight: 20
    footprint_logic: "weighted"
    day_filter: "all_days"
    direction_filter: "both"
    skip_overextended: false
    duration_max_minutes: 720
    duration_penalty_factor: 0.0
