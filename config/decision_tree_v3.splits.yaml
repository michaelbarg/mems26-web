# config/decision_tree_v3.splits.yaml — the ledger of every split tried on the V3 tree (LEARNING_DOCTRINE 09.09:
# an instruction ⇒ first a replay, then a branch; every verdict carries its number). A split enters
# config/decision_tree_v3.yaml only with a positive DAY-TOTAL replay vs the baseline (Michael 24.09); a
# refuted split stays here with its number so it is never re-proposed from memory.
#
# fields: id · path (the node the split hangs on) · question (the doctrinal reading) · variant (yaml) ·
#         candidate (n · win · Σ$ independent, from tree_measure) · day_total (58-session harness vs baseline)
#         · downstream (what the safety gates did to the admitted candidates) · verdict · date

splits:
  - id: V1
    date: 2026-09-25
    path: "opening_type=OPEN_DRIVE / phase=D / day_type=Variation / rel_bias=against"
    question: "drive open that became a Variation day, phase D (21:00+): responsive entries AGAINST the extension (late value return) — Dalton: the extension is exhausted late in a non-trend day"
    variant: harness_out/t480/tree_v1.yaml
    candidate: "n=68 · 60% · +1,310$ (with the extension: n=24 · 21% · −394$)"
    day_total: "58 sessions: baseline Σ+1,220.00$ → Σ+1,216.25$ · Δ −3.75$ gross / ≈ −19$ net of +6 round-trips · better 2 / worse 2 / same 54"
    downstream: "67 candidates reached the leaf: eod_entry_cutoff 24 · shadow producers 11 · ELQ 10 · LIVE 6 · entry_not_confirmed 5 · slot 4 — the candidate-level edge sits in entries the EOD cutoff forbids"
