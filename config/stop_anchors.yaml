# ═══════════════════════════════════════════════════════════════════════
# Stop Anchors + T1 Ladder + Contract Sizing — MEMS26 V9
# נסגר: Michael + מחקר, 2026-06-07. מסומן מקור פר-ערך:
#   ✅ = החלטת Michael · 🔬 = המלצת-מחקר (אושרה בעיקרון) · 📜 = מקור-אמת קיים
# כל שינוי-ערך = גרסה חדשה + אישור Michael. Git עוקב.
# ⚠️ נטען רק כש-STOP_ANCHORS_V2=1 (SHADOW בלבד). דגל כבוי = התנהגות-היום בדיוק.
# ═══════════════════════════════════════════════════════════════════════
version: 1
enabled_flag: STOP_ANCHORS_V2

# ── עקרונות-על (✅ Michael) ──────────────────────────────────────────
principles:
  structural_stop_always_wins: true   # ✅ הסטופ המבני תמיד גובר; ATR לא מזיז אותו לתוך הנר
  atr_cap_role: size_gate              # ✅ תקרת-ATR = שער-גודל בלבד (לא מזיזה סטופ)
  floor_ticks: 4                       # 📜 רצפת-סטופ קיימת (stop_params)
  anchor_offset_ticks: 6               # ✅ כל העוגנים: 6 ticks מעבר לקצה-המבני (מייקל 2026-07-20, היה 3 — הגנה מפסילת-שווא)
  structure_window_bars: 12            # ✅ מייקל 07-21/22 (C+D): חלון-מבנה-הכניסה (ברים-סגורים) ל-T1=סוף-מבנה ולסטופ=מאחורי-קיצון-המבנה (12×5ד'=שעה)
  t1_min_ticks: 2                      # ✅ C: פחות מזה מעבר-לכניסה = structure_exhausted (דחייה-כנה)

# ── תקרת-סיכון + סולם-חוזים (✅ Michael) ─────────────────────────────
risk_cap_points: 25                    # ✅ מקסימום סיכון לחוזה (25 נק' = $125)
contract_ladder:                       # ✅ חוזים לפי סיכון בנקודות (הזהיר תמיד גובר)
  - {max_risk_points: 15, contracts: 3}
  - {max_risk_points: 25, contracts: 2}
  - {max_risk_points: 999, contracts: 1}   # >25 נק' → חוזה 1

# ── תקרות-מצב: טקטית/אסטרטגית (✅ Michael) ───────────────────────────
# סיווג נגזר ממקור-אמת: trend_state (כיוון-יום) + auth verdict — לא ערך חדש.
#   ימי-Trend: עם-המגמה=אסטרטגית · נגד=טקטית (📜 auth: INITIATIVE=FULL, REV=SKIP)
#   ימי-ערך:   VAH↔VAL מלא=אסטרטגית · POC→קצה=טקטית (✅ Michael)
mode_caps:
  strategic: 3                         # ✅ אסטרטגית עד 3 חוזים
  tactical: 2                          # ✅ טקטית עד 2 חוזים

# חוזים סופי = min(contract_ladder, auth/Table-B, mode_cap)  (✅ הזהיר מבין השלושה)

# ── סולם-T1 לפי סיכון (✅ Michael 3-אזורים · 🔬 מחקר 2-אזורים) ────────
t1_floor_points: 3                     # ✅ 6א: T1 לעולם לא קרוב מ-3 נק' (חיכוך-עמלות)
t1_ladder_continuation:                # R-multiple לפי סיכון בנקודות
  - {max_risk_points: 5,  t1_r: 1.00}  # ✅ Michael
  - {max_risk_points: 10, t1_r: 0.75}  # ✅ Michael
  - {max_risk_points: 15, t1_r: 0.65}  # ✅ Michael
  - {max_risk_points: 20, t1_r: 0.50}  # 🔬 מחקר (אושר)
  - {max_risk_points: 25, t1_r: 0.40}  # 🔬 מחקר (אושר)
t1_reversal_multiplier: 0.80           # ✅ תבניות-היפוך: סולם × 0.8 (שמרני יותר)

# ── T1 Ladder V2 (flag T1_LADDER_V2, default OFF — wider targets) ──────
# Candidate values — final after backtest. All within guardrails t1_r_max=1.5.
t1_ladder_continuation_v2:
  - {max_risk_points: 5,  t1_r: 1.20}
  - {max_risk_points: 10, t1_r: 1.00}
  - {max_risk_points: 15, t1_r: 0.90}
  - {max_risk_points: 20, t1_r: 0.75}
  - {max_risk_points: 25, t1_r: 0.60}
t1_reversal_multiplier_v2: 0.90       # less restrictive for reversals
flag_relative_t1_v2:                   # S2 (five_min_system) linear interpolation
  t1_r_max: 1.00
  t1_r_min: 0.60
  dist_tight_pts: 15
  dist_wide_pts: 25

# ── נר-ענק (>25 נק' סיכון, חוזה 1) (✅/🔬) ───────────────────────────
giant_candle:
  applies_over_risk_points: 25
  target_mode: nearest_of              # 🔬 6ב (אושר): יעד = הקרוב מבין:
    # 1R · רמה-מבנית (POC/VAH/VAL/PDH/PDL) · 50-75% מהטווח-היומי-שנותר
  be_move_points: 15                   # ✅ Michael (מאומת Davey 567k: 0.3-0.6R אופטימום)
  first_spike_only: true               # 🔬 לא לרדוף spike שני/שלישי
  short_time_stop: false               # 🔬 בלי time-stop קצר (הגרוע במבחן)

# ── BE אחרי T1 (📜 קאנון נשמר — הצעת -2T נדחתה ע"י Michael) ───────────
be_after_t1: breakeven_plus_1tick      # 📜 Table C §6.1

# ── עוגן פר-תבנית ────────────────────────────────────────────────────
# type: cluster_low(N) | since_trendline_peak | zl_excursion | swing_extreme |
#       failed_bar | consolidation_extreme | extreme_bar | breakout_bar |
#       second_bottom_top | shoulder | flag_low | support_zone
# כולם -3T (anchor_offset_ticks). window = כמה ברים אחורה.
anchors:
  # ── S4 CONT (🔬 מחקר אושר; חלונות לפי מבנה-התבנית) ──
  # max_risk_points: 🔬 trial values (2026-06-12); CONT over cap → SIZE_DOWN to 1 contract, REV → SKIP
  ZLR:    {system: S4, group: CONT, type: breakout_bar,         window: 1, max_risk_points: 15}   # ✅ Michael · stop on breakout bar (2026-06-30, was cluster_low/4 → reached stale dips → 16.5pt SKIP)
  CONFLUENCE_RI_ZLR: {system: S4, group: CONT, type: breakout_bar, window: 1, max_risk_points: 7}  # 🔬 S2×S4 combined (CONFLUENCE_PATTERN_SPEC_2026-07-17.md §2/§4.2): deliberately tight — 7pt cap < ZLR's 15; SHADOW-only V1
  TLB:    {system: S4, group: CONT, type: since_trendline_peak, window: 8, max_risk_points: 15}   # 🔬 משתנה 3-8
  TT:     {system: S4, group: CONT, type: zl_excursion,         window: 9, max_risk_points: 15}   # 🔬 4-9
  GB100:  {system: S4, group: CONT, type: cluster_low,          window: 6, max_risk_points: 15}   # 🔬 חלון-6
  # ── S4 REV (🔬 עוגני-קיצון נשמרים; HTLB מורחב) ──
  VEGAS:  {system: S4, group: REV,  type: swing_extreme,        window: null, t1_measure_cap: 0.75, t2_measure_mult: 1.0, max_risk_points: 20}  # ✅ 2026-06-10: T1×0.75 T2×1.0
  GHOST:  {system: S4, group: REV,  type: shoulder,             window: null, t1_measure_cap: 0.5, max_risk_points: 18}  # 🔬 (Bulkowski MEASURED)
  FAMIR:  {system: S4, group: REV,  type: failed_bar,           window: null, max_risk_points: 12}  # 🔬
  HTLB:   {system: S4, group: REV,  type: consolidation_extreme, window: null, max_risk_points: 20} # 🔬 מורחב (לא בר-הפריצה)
  HFE:    {system: S4, group: REV,  type: extreme_bar,          window: null, t1_ladder_shift: -1, max_risk_points: 20}  # 🔬 התבנית-החלשה, מדרגה מטה
  # ── S2 (🔬 לפי Bulkowski MEASURED) ──
  Reactive:        {system: S2, type: support_zone,      window: 4, max_risk_points: 15}      # 🔬 אשכול/אזור-תמיכה
  OFA_Initiative:  {system: S2, type: breakout_bar,      window: 1, max_risk_points: 12}      # 🔬 ⚠️ נשאר הדוק! (מדוד 5188: הדוק מנצח ב-11%)
  Double_BT:       {system: S2, type: second_bottom_top, window: null, max_risk_points: 20}   # 🔬 מבנה (Bulkowski מפורש)
  HnS:             {system: S2, type: shoulder,          window: null, max_risk_points: 20}   # 🔬 כתף-ימין (לא neckline)
  Flag:            {system: S2, type: breakout_bar,      window: 1, max_risk_points: 15}      # ✅ Michael 2026-06-09: בר-הפריצה (לא flag_low/wick)

# ── Flag T1 יחסי (Michael 2026-06-09, tunable) ──────────────────────
# T1 = t1_r × risk. t1_r slides linearly from t1_r_max (tight stop) to
# t1_r_min (wide stop): t1_r = t1_r_max - (dist - dist_tight) / (dist_wide - dist_tight) × (t1_r_max - t1_r_min)
flag_relative_t1:
  t1_r_max: 0.8          # ✅ dist ≤ 15pt → t1_r = 0.8
  t1_r_min: 0.4          # ✅ dist ≥ 25pt → t1_r = 0.4
  dist_tight_pts: 15     # ✅ tight-stop boundary (points)
  dist_wide_pts: 25      # ✅ wide-stop boundary (points)

# ── Runner Trail (RUNNER_TRAIL_V1, default OFF) ──────────────────────
# ⚠️ INERT in production: bar_level_detector takes the DYNAMIC_STRUCT_TRAIL
# branch first (both flags =1), so this k_risk chandelier never runs. Verified
# 2026-08-20 from the books: action='TRAIL' = 127 rows, all shadow, all 06-18..24.
runner_trail:
  k_risk: 1.0             # trail = hwm − k×initial_risk (backtest: 1.0 optimal)

# ── F5 Structural Swing Trail (RUNNER_TRAIL_V2, default OFF) ─────────
# Michael 2026-08-20, ORACLE_STUDY_2026-08-20 §5 R-A (+$2,315 over 32 sessions).
# The runner leg is placed WITHOUT a fixed target (stop-only OCO group) and its
# stop trails behind the last CONFIRMED 5-min swing low (LONG) / high (SHORT).
# Never widens; floored at BE+1T after T1; banked legs untouched (ladder stands).
# The swing threshold itself is NOT tunable here on purpose — it is
# clamp(1.0×ATR(prev session), 4.0, 12.0), the exact definition the $2,315 was
# measured with (backend/v9/services/trade_manager/swing_trail.py).
runner_trail_v2:
  offset_ticks: 1          # stop sits 1 tick beyond the swing extreme
  # rev_fallback_pts: 6.0  # ⚠️ leave COMMENTED: absent ⇒ no prior-session ATR is an
                           # honest no-op (Rule 1), not an invented threshold.

# ── Dynamic Structure-Trail (DYNAMIC_STRUCT_TRAIL, default OFF) ──────
# Michael's rule: runners re-anchor on each NEW CONSOLIDATION (balance zone)
# after advance. Replaces the simple hwm trail when ON.
dynamic_struct_trail:
  min_bars: 3              # K: minimum bars in the consolidation zone
  max_range_atr_frac: 0.5  # R: max zone range as fraction of ATR-14
  min_advance_risk_mult: 1.0  # M: min advance (risk multiples) before a consolidation counts
  range_floor_pts: 2.0     # absolute floor for zone range threshold (points)
  # S4 (Woodies) variant — separate params per handoff spec (NOT-DONE: needs Michael's values)
  # s4_min_bars: 3
  # s4_max_range_atr_frac: 0.4
  # s4_min_advance_risk_mult: 0.75

# ── Guardrails (schema-validation בטעינה) ────────────────────────────
guardrails:
  max_contracts: 3
  max_risk_points: 30          # מעבר לזה = דחיית-config (לא סיכון אמיתי)
  t1_r_min: 0.2
  t1_r_max: 1.5
  anchor_offset_ticks_max: 6

# ── Pattern × DayType Stop Table (flag STOP_TABLE_V1, default OFF) ─────────
# Pairs with the `anchors:` block above. Mirrors the SHAPE of
# targets.yaml `pattern_t1_points` (pattern → day_type → spec), but for STOPS.
# Consulted ONLY when BOTH STOP_TABLE_V1=1 AND STOP_RESOLVER_V1=1. When the
# flag is OFF, or a pattern×day_type is absent here, the generic CONT/REV ATR
# band resolver runs UNCHANGED (byte-identical to today).
#
# Each pattern×day_type entry may carry any of:
#   max_risk_pts : hard cap on stop distance in POINTS for this pattern×day_type
#   band_cap_atr : cap as a multiple of ATR_5m; the tighter of this vs the
#                  generic band multiplier (1.2×ATR CONT / 1.5×ATR REV) wins
#   anchor_type  : ADVISORY ONLY in V1 — logged, NOT yet used to re-pick the
#                  rung ladder. Wiring anchor_type to rung selection can change
#                  risk in either direction, so it is a separate future step
#                  with its own Michael sign-off.
#
# SAFETY INVARIANT (enforced in trading_gateway._stop_table_effective_cap):
#   effective_cap = min(generic_cap, max_risk_pts, band_cap_atr × ATR_5m)
# The table can ONLY tighten (or equal) the existing ATR band cap — it can
# NEVER widen risk beyond today's generic resolver cap / the 25pt global cap.
#
# ⚠️ PLACEHOLDER VALUES — conservative + illustrative, for Michael to TUNE.
#   The `max_risk_pts` below simply MIRROR the per-pattern `max_risk_points`
#   already documented in the `anchors:` block, and `band_cap_atr` is set to
#   the generic family multiplier (a no-op), so enabling the flag in SHADOW
#   changes NOTHING until Michael tightens these numbers per day_type.
pattern_stop:
  REACTIVE_LONG:                # REV family (generic cap 1.5×ATR)
    Variation:      {max_risk_pts: 15, band_cap_atr: 1.5, anchor_type: support_zone}
  REACTIVE_SHORT:               # REV family
    Variation:      {max_risk_pts: 15, band_cap_atr: 1.5, anchor_type: support_zone}
  INITIATIVE_LONG:              # CONT family (generic cap 1.2×ATR)
    Variation:      {max_risk_pts: 12, band_cap_atr: 1.2, anchor_type: breakout_bar}
  INITIATIVE_SHORT:             # CONT family
    Variation:      {max_risk_pts: 12, band_cap_atr: 1.2, anchor_type: breakout_bar}
  TLB:                          # CONT family
    Trend_Normal:   {max_risk_pts: 15, band_cap_atr: 1.2, anchor_type: since_trendline_peak}
