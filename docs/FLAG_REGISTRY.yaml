  T1_STRUCTURE_END_V1:
    category: targets
    what: "T1 = the END of the entry structure (profit-side extreme of the completed-bar structure window, structure_window_bars=12) - REPLACES ladder/R T1 for S4 CONT + S2 Reactive/OFA. Chart patterns (HNS/Double/Flag/VEGAS/GHOST measure) keep pattern-measure. Structure exhausted (<t1_min_ticks beyond entry) -> computed T1 kept + honest log/metadata."
    why: "Michael ruling 2026-07-21 ~18:15: T1 at the entry-structure END; cancel the current computation. Root of 07-21: ladder T1 0.25-3pt vs structural stops 7.5-23pt -> R:R 0.01-0.53 blocked every with-trend CONT (ZLR 17:45 pair, GB100 17:30) on a Trend-up day."
    standing_decision: true
    ref: "backend/v9/systems/stop_anchors/resolver.py (structure_end_t1); woodies_system.py; five_min_system.py"
  STOP_STRUCTURE_EXTREME_V1:
    category: stops
    what: "Stop anchors BEHIND the structure extreme over the completed-bar structure window (widen-only vs current stop; +anchor_offset_ticks). S2: widens window:1 anchor windows to structure_window_bars. S4: window-extreme candidate vs pattern stop; gateway+Sierra receive the corrected stop (was best.stop raw)."
    why: "Michael ruling 2026-07-21 22:22: stop behind structure extreme, not a single bar (supersedes breakout_bar/window:1, 06-30). Evidence: 1.75-3.5pt stops vs 7554.25 structure edge."
    standing_decision: true
    ref: "backend/v9/systems/stop_anchors/resolver.py (widen_stop_to_structure); woodies_system.py; five_min_system.py"
  STOP_WIDEN_TO_STRUCTURE_V1:
    category: sizing
    what: "When structural stop distance exceeds ATR cap, ACCEPT it (not reject). Structure always wins per Dalton. ATR cap drives contract reduction (SIZE_CAP_CUT_V1) instead of stop rejection."
    why: "OFF (default). Case #420: resolver rejected structural stop at 7529 (>cap 15pt) and used narrow 7514 (inside structure). Dalton: structure governs; ATR reduces size."
    standing_decision: true
    status: built_off
    ref: "backend/v9/systems/stop_anchors/stop_resolver.py · tests/v9/regression/test_stop_structural_wins.py"
  BE_AFTER_REAL_T1_V1:
    category: targets
    what: "4-contract T0 remap: DLL reports fills as T1/T2/T3/T4 (slot order). With FIXED_CONTRACTS_4+T0_TARGET_PTS, C1 is T0 scalp — remap T1→T0 (no BE), T2→T1 (BE here), T3→T2, T4→T3. Ensures BE fires on the REAL T1, not the T0 scalp."
    why: "OFF (default). Michael ruling 2026-07-20: BE after T1-the-real, not T0."
    standing_decision: true
    status: built_off
    ref: "backend/v9/services/trade_manager/manager.py"
  MANUAL_CANCEL_DETECT_V1:
    category: risk
    what: "When Sierra is flat and TM has an open trade (N consecutive checks), mark trade CANCELLED (not CLOSED) and release gateway slot immediately. Detects manual cancellation by Michael."
    why: "OFF (default). Michael ruling 2026-07-20: manual flatten must not cause false-orphan/naked alerts. Extending PHANTOM_HEAL_V1 with CANCELLED state + immediate slot release."
    standing_decision: true
    status: built_off
    ref: "backend/v9/services/sierra_position_reconciler.py · tests/v9/regression/test_manual_cancel_detect.py"
  ORPHAN_AUTO_STOP_V1:
    category: risk
    what: "When ON, orphan positions get a virtual structural stop monitored by the reconciler. FLATTEN_ORPHAN (market-exit) fires only when (1) price crosses the structural stop or (2) unrealized loss >= ORPHAN_MAX_LOSS_USD."
    why: "OFF (default). Michael ruling 2026-07-17+07-20: redesigned from immediate-flatten to structural-stop+$200-cap. Enabling requires Michael sign-off + sim."
    standing_decision: true
    status: built_off
    ref: "backend/v9/services/sierra_position_reconciler.py"
  ORPHAN_MAX_LOSS_USD:
    category: param
    what: "Maximum unrealized loss in USD before orphan position is flattened. Default 200. MES = $12.50/pt/contract."
    why: "Safety cap — flatten at this dollar loss even if structural stop not crossed."
    status: param
    ref: "backend/v9/services/sierra_position_reconciler.py"
  ORPHAN_AUTO_STOP_MAX_QTY:
    category: param
    what: "Maximum |qty| for orphan auto-stop (sanity cap against bad state reads). Default 10."
    why: "Safety guard — refuse if position size exceeds this."
    status: param
  ORPHAN_AUTO_STOP_COOLDOWN_S:
    category: param
    what: "Minimum seconds between orphan flatten attempts. Default 60."
    why: "Rate-limit — prevent rapid-fire flatten attempts."
    status: param
  RECONCILER_OWNERSHIP_AWARE_V1:
    category: risk
    what: "Mixed-account reconciler: Sierra position with no system orders in order_map = manual trade → INFO, not NAKED ORPHAN. Prevents false alerts on Michael's manual trades."
    why: "ENABLED 07-24 (cowork, per Michael ruling 12:20 'keep mixed, fix reconciler'). Account 37138283 is mixed (Michael trades manually alongside system). Closes false-orphan class 07-10/14/17/20/23. Risk-reducing. 4 tests."
