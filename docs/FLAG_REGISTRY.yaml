  OPENING_DIR_FUSION_V1:
    category: s2
    what: "Volume-confirmed opening-direction GATE over the opening entries: opening (first-30min) volume vs trailing median + 30-min momentum + level-break acceptance -> UP/DOWN/None. None (low-conviction/auction, or a break conflicting with momentum) suppresses the opening trade; otherwise drops triggers fighting the direction. Never fires a trade itself. get_opening_dir_fusion() (trade_context) + pure opening_dir_fusion() (opening_entry)."
    why: "ENABLED 07-24 (cowork, per Michael 'build + wire to live now'). Study docs/reports/OPENING_SIGNAL_EDGE_2026-07-24: 73% on fire-days vs the classifier's 53%; volume +7pts; gap anti-predictive; half the edge is skipping low-conviction days. CAVEAT: 11 fire-day sample, Michael chose live wiring explicitly. Risk-reducing (a gate, not a new trigger). Verified: 7 tests, OFF=byte-identical, regression 141<=142."
    status: enabled
    ref: "OPENING_SIGNAL_EDGE_2026-07-24.md · RULED מייקל 07-24 build+wire-live-now · cowork"
  PATTERN_STOP_COOLDOWN_V1:
    category: risk
    what: "W7 gateway gate: after a STOP_HIT on the same pattern-family+direction, block an identical re-entry within PATTERN_STOP_COOLDOWN_BARS*5min (default 30min) unless the new entry is >= PATTERN_STOP_COOLDOWN_MIN_DIST_PT (4.0) from the stopped entry. First fire passes; serial refires blocked (Dalton acceptance p.288-292)."
