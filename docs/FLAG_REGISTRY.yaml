# FLAG_REGISTRY.yaml — hand-authored SEMANTICS for the MEMS26 flag index.
#
# The generator (scripts/gen_flag_index.py) MERGES these hand-authored fields with
# a live scan of the code (os.getenv / environ.get / flag()) and the live .env to
# produce docs/FLAG_INDEX.md. The mechanical columns (file:line, code default,
# current .env state, ON/OFF) are computed by the generator and CANNOT go stale.
# This file holds only the columns a machine can't infer: what / why / category.
#
# RULES FOR FUTURE AGENTS (CC, Cursor, Cowork):
#   * Edit THIS file for what/why. NEVER hand-edit docs/FLAG_INDEX.md (it is generated).
#   * When you add a new behavior/trading flag in code, add an entry here, then run:
#       python3 scripts/gen_flag_index.py
#   * The generator will flag (⚠ UNDOCUMENTED) any behavior flag found in code but
#     missing here — that warning is your TODO, not noise.
#   * Scope = behavior / trading / classification / sizing flags. Infra, secrets,
#     connection strings and pure ops/data-pipeline env vars are intentionally
#     OUT of scope (see INFRA_EXCLUDE in the generator).
#
# Per-flag fields (all optional except category + what):
#   category: s1 | s2 | s3 | s4 | cascade_gate | sizing | targets | risk | param | misc
#   what:     one line — what the flag does
#   why:      one line — why it is in its current state (esp. OFF / standing)
#   group:    optional sub-label shown next to the flag
#   inert_when: optional — note that the flag is ON-but-INERT (superseded at runtime)
#   standing_decision: true  -> OFF is a deliberate standing decision; Michael sign-off to enable
#   status: live | rejected | awaiting_backtest | not_built | deferred   (optional)
#   ref:    optional pointer (doc §, issue id)

flags:
  RELEASE_ENTRY_GATE_V1:
    what: "מחזיק איתות-כניסה עד שהמחיר עוזב את אזור-ההידבקות (שפלים-עולים + נפח מתייבש + בר שסוגר מחוץ לאזור עם נפח חוזר)"
    why: "מייקל 07-28: הכיוון נכון אבל הכניסה מוקדמת — הסטופ יושב בתוך הרעש והעסקה מתה לפני המהלך שהיא ניבאה. כניסה בשחרור מייצרת גם את הסטופ המבני הרחב."
    risk: "מגביל-בלבד: מעכב או מדלג על איתות קיים. לא יורה מעצמו, לא משנה כיוון, לא מגדיל סיכון. נכשל-סגור."
  MARGIN_AWARE_SIZING_V1:
    what: "מגביל את מספר החוזים למה שהמרג'ין הפנוי בחשבון נושא בפועל (Account Monitor)"
    why: "מייקל 07-28: 4 חוזים = $1104.84 מרג'ין מול $97.68 פנוי — כל ירי נדחה ע\"י הברוקר (6 דחיות NLV באותו בוקר). עסקה קטנה אמיתית עדיפה על דחייה ודאית."
    risk: "מקטין-בלבד. נתוני-חשבון חסרים או ישנים -> לא משנה כלום (חוק 1)."

  # ───────────────────────── S1 — day-type / classification ─────────────────────────
  S1_CVD_OPENING:
    category: s1
    what: "Seed the early day-type read from opening-window CVD."
    why: "SHADOW calibration, enabled before the soak (Michael 31/5)."
  S1_IB_WIDTH_ATR:
    category: s1
    what: "Measure IB width in ATR units (relative) for day-type width tests."
    why: "SHADOW calibration (Michael 31/5)."
  S1_DAYTYPE_STAGING:
    category: s1
    what: "Staged day-type lifecycle: opening_type@15m / day_type@30m / IB-lock@60m / intraday reclass."
    why: "PERMANENT S1 staging spec; enabled before SHADOW soak."
    ref: "memory: project_s1_staging_spec"
  S1_DYNAMIC_RECLASS:
    category: s1
    what: "Continuously re-evaluate day-type IB-relative after IB lock (shadow log)."
    why: 'Michael 2026-06-08 — "the system constantly checks which day-type".'
  S1_LIVE_RECLASS:
    category: s1
    what: "Apply the dynamic reclassification to the LIVE day_type (not just log it)."
    why: "Pair of S1_DYNAMIC_RECLASS — both required for the day-type to keep re-evaluating."
  S1_PROVISIONAL_DAYTYPE:
    category: s1
    what: "Emit a provisional day_type at 30m (before the 60m IB lock); lock still overrides."
    why: "Eliminates the 60-min UNKNOWN gap."
  S1_NEW_CLASSIFIER:
    category: s1
    what: "Promote the validated 7-type classifier label to the trade gate (day_type_at_entry → 3 gates + stamp)."
    why: "Michael approved 2026-06-20; fail-safe. Off-switch: =0 + restart."
    ref: "memory: project_s1_promotion_live"
  S1_ENGINE_NEW_CLASSIFIER:
    category: s1
    what: "Live per-bar engine uses the 7-type classifier instead of the old 3-type engine (part-b)."
    why: "Michael approved 2026-06-22 mid-session."
  REHYDRATE_CLS_BARS:
    category: s1
    what: "On mid-session restart, seed _cls_rth_bars from DB (v9_bars_5min_woodies) when IB locked but buffer short. Prevents ~1h classifier starvation (#11)."
    why: "ON by default (fail-safe, not a trading-logic change — restores the buffer that existed before restart). Disable with =0 + restart."
  S1_OPEN_DRIVE_TREND:
    category: s1
    what: "OPEN_DRIVE/OPEN_TEST_DRIVE waives the rib>=2.5 Trend floor: a 1-sided day that opened with a drive + directional one_tf + close-at-extreme classifies Trend_Normal even with a modest range extension."
    why: "OFF (default, SHADOW). Michael 2026-06-30: an OPEN_DRIVE day (rib 1.56, one_tf UP, close 0.915) was under-called Variation; affects management (Trend lets runners run). Re-call = trading-logic -> Michael sign-off + restart."
    status: deferred
    ref: "docs/handoff/CC_FIRING_PIPELINE_UNIFIED_2026-06-30.md (#3)"

  DAYTYPE_ANTIFLAP_V1:
    category: s1
    what: "Anti-flap hysteresis for day-type transitions: a new classification must hold for DAYTYPE_ANTIFLAP_HOLD_S seconds before the transition commits. Prevents Nontrend↔Normal↔Variation cycling within minutes."
    why: "OFF (default). Incident 07-09: day_type flapped 3 types in an hour, confusing gates + management. Trading-risk-surface → Michael sign-off."
    status: deferred
    ref: "docs/handoff/CC_LIVE_INCIDENT_FIXPACK_2026-07-09.md"
  DAYTYPE_ANTIFLAP_HOLD_S:
    category: param
    group: "S1 anti-flap"
    what: "Hold time (seconds) for DAYTYPE_ANTIFLAP_V1: new classification must persist this long before transition. Default 300 (5 min). Inert when DAYTYPE_ANTIFLAP_V1 is OFF."
    why: "Tuning knob — 300s = 1 bar window, 600s = 2 bars."
    status: param
  DAYTYPE_ONE_SOURCE_V1:
    category: s1
    what: "All day-type consumers (gates, UI, direction_context) read from ONE live source (get_live_day_type, hysteresis-stabilized) instead of the v9_day_type_state table. Eliminates split-brain: engine=UI=gates see one value."
    why: "OFF (default). Incident 07-09: v9_day_type_state writer died, gates read stale table while in-memory machine kept running. Trading-risk-surface → Michael sign-off."
    status: deferred
    ref: "docs/handoff/PROMPT_S1_FLAPPING_2026-07-09.md"
  SIERRA_CMD_TTL_S:
    category: param
    what: "K1 (2026-08-08): backend-side TTL for queued Sierra commands (default 90s). The drainer ARCHIVES (never sends) a queued-unsent command older than this — the DLL op-path has NO TTL, so a stale PLACE/CANCEL replayed later would EXECUTE (Friday 08-07: PLACE #652 + CANCEL sat in the jammed queue for hours)."
    why: "Param, always active in drain_command_queue. Raising it widens the window in which a delayed command may still fire — keep small."
  SIERRA_CMD_ACK_GRACE_S:
    category: param
    what: "K1 (2026-08-08): how long a SENT command may wait for the DLL ACK (trade_result.json mtime) before the drainer archives it (default 15s). Never resent — a missing ACK is indistinguishable from 'executed, result write failed' (merged.cpp:3040), so a resend could double-place."
    why: "Param, always active in drain_command_queue. While a sent command waits within grace, the queue holds (in-flight command is never overwritten)."
  SIERRA_RECONCILER_V1:
    category: risk
    what: "Periodic Sierra position reconciliation: compare TM open trades vs TradeActivityLog position qty. Divergence → WARNING + freeze auto-management. Runs in FillPoller loop every 30s."
    why: "OFF (default). Incident 333: records≠reality would have been caught in ≤30s. Michael sign-off to enable."
    status: deferred
    ref: "docs/handoff/CC_LIVE_INCIDENT_FIXPACK_2026-07-09.md FIX-6"

  # ───────────────────────── S2 — 5-min (Reactive / Initiative) ─────────────────────────
  REV_EDGE_DAY_STRUCTURE_V1:
    category: doctrine
    what: "REV 'edge' extended beyond prior-day value: day_low/day_high, ib_low/ib_high (post-lock), opening-bar extreme. At-edge = entry OR stop (structure proxy) within zone tolerance of the level; entry allowed ONLY after a probe against THAT level (bar touched within 0.5pt AND closed back beyond level+0.5 — sliding close does not count). Wrong-zone with no day edge -> original block. Fail-open only into the ORIGINAL block."
    why: "Michael ruling 2026-07-22 ('מאשר'): the 07-21 morning double-bottom at day-low 7521.5x2 ran +25pt with no armed edge — VAL was 25pt below. Days basing above value never touch VAL; day-structure edges are Dalton edges too."
    standing_decision: true
    ref: "backend/v9/systems/location_gate.py (day_structure_edge, probe_level); trading_gateway.py (session levels feed)"
  OPENING_ENTRY_V1:
    category: entries
    what: "Dalton opening-type ENTRY triggers, REVISED per the 31-session historical validation (naive spec scored -6.12R -> NOT live). DRIVE only on narrow OR (<=10pt); TEST_DRIVE excursion >=50% OR from bar 2 (bar-1-wick artifact killed); ORR supersedes a drive; AUCTION=none. value=shadow -> setups emit with metadata.shadow_only (gateway records, never routes demo/live); value=1 -> live-eligible (requires separate Michael ruling after shadow proof)."
    why: "Michael 07-22: the system must FIRE per opening type, agent-validated on history first. Shadow phase collects forward evidence at zero risk."
    standing_decision: true
    ref: "backend/v9/systems/opening_entry.py; five_min_system.py (hook); trading_gateway.py (shadow_only guard)"
  OPENING_FIRE_CVD_V1:
    category: s2
    what: "CVD-confirm OPEN_DRIVE + suppress pre-IB-lock old-engine directional fallback for pattern selection."
    why: "OFF (default, SHADOW only). 2026-06-29 incident: 4× INITIATIVE_SHORT fired on premature Variation + unconfirmed drive (CVD absorption ignored). Michael sign-off required to enable."
    status: deferred
    ref: "docs/handoff/CC_STAGE0_OPENING_FIRE_CVD_2026-06-29.md"
  DAYTYPE_PATTERN_AWARE_V1:
    category: s2
    what: "Pattern-family gate: balanced day → REV only (block CONT); trend/variation → CONT only (block REV). Post-IB-lock."
    why: "OFF (default, SHADOW only). 2026-06-29: INITIATIVE_SHORT fired on Normal day (should be REV-only). Michael sign-off required."
    status: deferred
    ref: "docs/handoff/CC_STAGE1_PATTERN_AWARE_GATE_2026-06-29.md"
  DAYTYPE_GATE_LIVE_V1:
    category: s2
    what: "Read day_type for position gate + auth table from the LIVE in-memory promoted attribute (app.state.day_type_machine.day_type) instead of classify_replay DB cache. Fixes I-44/I-50 source split."
    why: "OFF (default, SHADOW only). 2026-06-30: position gate saw stale Normal while live was Trend_Normal → blocked CONT on a trend day (0 trades). Michael sign-off required."
    status: deferred
    ref: "I-44/I-50 in docs/reports/MEMS26_ISSUES_REGISTER.md"
  DAYTYPE_HONEST_PRELOCK_V1:
    category: s2
    what: "get_live_day_type() reports None ('forming/unknown') before the IB locks, instead of whatever the OLD base state-machine's own low-confidence read happens to hold (e.g. Trend_Normal 0.35 seen live pre-lock 07-15/07-16)."
    why: "OFF (default). N1c 2026-07-17: the old-engine's pre-lock value wasn't in the exclusion list, so it leaked through dashboard/pocket screens looking canonical. DAY_TYPE_MANUAL_OVERRIDE still takes precedence. Michael sign-off before enabling on live screens."
    ref: "docs/handoff/NIGHT_PROMPT_2026-07-17.md N1(c); tests/v9/regression/test_daytype_honest_prelock.py"
  S1_IB_SANITY_V1:
    category: s1
    what: "Sanity-check the Sierra-exported IB against the first-12-bars' own extremes once >=12 RTH bars exist; fall back to the bars-derived IB (+ tag ib_source) when inconsistent by >2 ticks/2pt."
    why: "OFF (default). N1a/N1b 2026-07-17: Sierra IB proven to be a stale pre-open snapshot on 07-15 (exported 7591.75-7619.0 vs true 7601.25-7626.25) — fed a phantom UP side and a false mid-session Neutral. Trading-risk-surface (changes classification) → Michael sign-off + sim verification before live."
    ref: "docs/handoff/N1B_TRANSITIONS_DIAGNOSIS_2026-07-17.md RC#1; tests/v9/regression/test_s1_ib_sanity.py"
  TS_WHOLE_HOUR_NORMALIZE_V1:
    category: ingest
    what: "A5 root-fix: advancing feed whose newest bar sits ~N whole hours behind wall-clock (N=1..6, tol 330s covering in-bar age) is shifted +N*3600 to TRUE time at ingest, BEFORE the honest TS gate. Frozen/re-push batches (newest not advancing) are NEVER shifted (07-17 ghost-class rail); post-shift newest must be current (<=900s)."
    why: "Measured 07-23: raw export -5h, bridge +4h -> bars landed -1h with hour-fix OFF (A5 FAILED live). Replaces the 1h-only +-120s hour-fix whose window was narrower than the 300s bar period (dup-ghost class). Normalize-then-gate."
    standing_decision: true
    ref: "backend/v9/api/v9/bars.py (_ts_whole_hour_normalize; wired before gate in /5min and /woodies_5min)"
  TS_OFFSET_INGEST_GATE_V1:
    category: s1
    what: "Reject a bars batch (5min + woodies_5min ingest) whose newest bar-ts ADVANCES push-to-push (feed alive) while sitting > TS_OFFSET_REJECT_SEC (default 900s) behind server-now — a live-but-mislabeled TS feed. Honest reject, no guessed shift; paused-market/idempotent re-push (newest unchanged) always passes."
    why: "OFF (default; Michael approved building 2026-07-20 22:44). Loop-closure for the 07-20 incident: the pre-restart backend wrote the whole RTH session -1h, below _hour_shift_fix's tight 3600±120s window, so batches were neither shifted nor rejected → wrong first-12-bars IB → S1 IB-sanity replaced the CORRECT Sierra IB → false Neutral_Extreme from 13:40 ET. Enabling = data-path change → Michael ruling + restart."
    ref: "tests/v9/regression/test_ts_offset_ingest_gate.py; LIVE_CHANNEL 2026-07-20 22:35"
  TS_OFFSET_REJECT_SEC:
    category: param
    what: "Threshold (seconds behind server-now, default 900) for TS_OFFSET_INGEST_GATE_V1's live-but-mislabeled rejection."
    why: "900s = 3 bar-periods of slack; catches the -1h class while tolerating routing lag. Inert while the gate flag is OFF."
  S1_NEUTRAL_PRECEDENCE_V1:
    category: s1
    what: "In classify(), a two-sided day (sides==2) outranks a still-held single-side acceptance-reclass — previously the acceptance-reclass early-return shadowed Neutral entirely whenever S1_ACCEPTANCE_RECLASS_V1 was also on."
    why: "OFF (default; also a no-op unless S1_ACCEPTANCE_RECLASS_V1 is on). N1b 2026-07-17: live 07-15 flip to Neutral_Center lagged to 20:46 IL vs the mechanically-correct ~19:05 IL. Doctrine ruling 06-20: sides==2 should win. Trading-risk-surface → Michael sign-off + sim verification before live."
    ref: "docs/handoff/N1B_TRANSITIONS_DIAGNOSIS_2026-07-17.md RC#2; tests/v9/regression/test_s1_neutral_precedence.py"
  S1_CONF_SMOOTH_V1:
    category: s1
    what: "Slew-cap the PUBLISHED day-type confidence at the sequence layer (live promoter in backend/main.py + classify_replay timeline): moves at most S1_CONF_SMOOTH_MAX_DELTA (default 0.25) per bar toward the raw _confidence score. Type decisions untouched — only the confidence number."
    why: "OFF (default). N1 RC#3 2026-07-17: _confidence() switches between the 8-item directional and 3-item balance evidence lists when its direction-basis flips, so the persisted conf flapped 0.12↔0.67↔1.00 on adjacent bars with no market change (max adjacent delta 0.88 in the 07-15/07-16 replays). Cosmetic/display stability; guarantees the N1B T2 bound (adjacent delta ≤0.35). Michael sign-off before enabling (published-confidence surface)."
    ref: "docs/handoff/N1B_TRANSITIONS_DIAGNOSIS_2026-07-17.md RC#3; tests/v9/regression/test_s1_conf_smooth.py"
  S1_CONF_SMOOTH_MAX_DELTA:
    category: param
    group: "day-type classifier"
    what: "S1_CONF_SMOOTH_V1 param: max per-bar confidence movement (default 0.25)."
    why: "Calibration knob; 0.25 satisfies the N1B T2 ≤0.35 bound by construction."
  DAY_DIRECTION_DOCTRINE_V1:
    category: cascade_gate
    what: "On directional days (Variation/Trend), only with-expansion entries allowed. Counter-expansion blocked unless halt-proof (2 closes back through expansion level). Reference = IB expansion side, not local LSMA."
    why: "OFF (default, SHADOW). Michael 07-02: 'trades with the trend direction, until proven stopped'. Subsumes item-1 counter-REACTIVE SKIP."
    status: deferred
  STOP_RESOLVER_V1:
    category: sizing
    what: "Structural stop band: floor 0.5×ATR, cap 1.2×ATR(CONT)/1.5×ATR(REV), walk per-pattern rung ladder from nearest to farthest, pick first in-band. Too close → next rung. All above cap → no_stop_in_band (reject)."
    why: "OFF (default, SHADOW). 07-02: right-direction shorts died -1R on tight initial stops. Lever #1 for P&L."
    status: deferred
  RR_ENTRY_GATE_V1:
    category: cascade_gate
    what: "Block entry when T1 distance < stop distance (net-negative R:R = stop-funding). Michael rule 06-20."
    why: "OFF (default, SHADOW). Since 06-20 only 8/55 trades hit T1; C1:stop ratios as low as 0.77 (direct stop-funding)."
    status: deferred
  RR_MIN_ROTATION:
    category: cascade_gate
    what: "Value flag (e.g. 0.65): graded R:R minimum on ROTATION day-types only (Variation/Normal/Neutral). T1_dist >= stop_dist*value instead of >=1.0. Unset -> 1.0 everywhere; Trend days always 1.0; day-type error -> 1.0 (conservative)."
    why: "07-15 evening (Michael): stop-floor 0.8xATR x nearest-shelf T1 made R:R ~always <1 on narrow rotation day - blocked the winning 18:15 ZLR SHORT (0.65). With T0=3.5 fast-take ladder, T1-only R:R is double-conservative. Value = Michael's ruling."
    status: pending_michael
  ZONE_LIMIT_ENTRY_V1:
    category: cascade_gate
    group: "N3 no-late-entry"
    what: "Block entry when the setup is LATE: (a) live price drifted ADVERSE past entry by > ZONE_LIMIT_MAX_DRIFT_PT (chasing; favorable drift passes), or (b) signal bar older than ZONE_LIMIT_MAX_AGE_SEC when the setup carries bar_ts (today only CONFLUENCE_RI_ZLR does; S2/S4 dormant on this axis). Price = same canonical source as /api/v9/live_price; missing price/ts -> fail-OPEN. blocked_by=zone_limit_late_entry."
    why: "OFF (default). Michael ruling 2026-07-17: 'לא תהיה כניסה באף תבנית בשלב מאוחר מדי' — no pattern may enter too late after its signal. Blocking half of N3 only; the resting-limit entry half stays with cc-imac (DLL limit-PLACE check + sim cycle) per the N3 spec."
    status: built_off
    ref: "docs/handoff/N3_ZONE_LIMIT_ENTRY_SPEC_2026-07-17.md · backend/v9/gateway/trading_gateway.py"
  ZONE_LIMIT_MAX_DRIFT_PT:
    category: param
    group: "N3 no-late-entry"
    what: "Max ADVERSE price drift (points) between setup entry_price and live price before the entry counts as chasing and is blocked. Default 2.0. Inert while ZONE_LIMIT_ENTRY_V1 is OFF."
    why: "Michael ruling 2026-07-17 (no-late-entries). 2.0pt conservative default pending Michael's tuning."
  ZONE_LIMIT_MAX_AGE_SEC:
    category: param
    group: "N3 no-late-entry"
    what: "Max age (seconds) of the signal bar timestamp before the entry counts as late and is blocked. Default 180. Only applies when the setup carries a parseable bar_ts/signal_ts; otherwise skipped (fail-open). Inert while ZONE_LIMIT_ENTRY_V1 is OFF."
    why: "Michael ruling 2026-07-17 (no-late-entries). 180s ≈ signal older than half a 5-min bar+routing slack pending Michael's tuning."
  EOD_RISK_WINDOW_V1:
    category: cascade_gate
    what: "EOD entry cutoff (no new entries last 45min before close) + flatten at 15min before close."
    why: "OFF (default, SHADOW). Michael rule 07-02: 45min cutoff + 15min flatten. Trades 287/288 were open at 14:2x CT."
    status: deferred
  OPPOSITE_EXIT_V1:
    category: cascade_gate
    what: "Close active trade when >=2 opposite-direction pattern signals fire within a bar. Close only, no auto-flip."
    why: "OFF (default, SHADOW only). Michael's rule 2026-07-01: 2 opposite signals = exit the position. Trading-risk → sign-off required."
    status: deferred
  S2_CVD_DETECTION_V1:
    category: s2
    what: "CVD confirmation inside S2 detection geometry: REACTIVE requires absorption (entry-bar delta OR price/CVD divergence), INITIATIVE requires net delta with-flow. Fail-open on stale CVD."
    why: "OFF (default, SHADOW only). 2026-06-29: INITIATIVE_SHORT fired without CVD confirmation despite +3,403 absorption. Michael sign-off required."
    status: deferred
    ref: "docs/handoff/CC_STAGE2_CVD_DETECTION_2026-06-30.md"
  S2_ATR_RELATIVE:
    category: s2
    what: "Scale S2 thresholds to ATR (relative) instead of fixed points."
    why: "SHADOW calibration (Michael 31/5)."
  S2_VSA_VOLUME:
    category: s2
    what: "Enable the 3-variant VSA/RVOL volume gate; variant selected from config/s2_firing.yaml."
    why: "Moved into .env so all launch paths share it; matches prior start_all.sh export."
  S2_DETECTION_LOG:
    category: s2
    what: "Verbose S2 detection logging (observability)."
    why: "Anchor-trial diagnostics (2026-06-12)."
  S2_CHART_ALL_DAYTYPES:
    category: s2
    what: "Allow the S2 chart-pattern family (FLAGS/HnS/…) to evaluate across all day-types."
    why: "Anchor-trial (2026-06-12)."
  S2_VOL_ADAPTIVE:
    category: s2
    what: "Adaptive volatility-regime adjustment for S2 thresholds/sizing."
    why: "Anchor-trial (2026-06-12)."
  S2_VOL_REGIME_PT:
    category: param
    group: "S2 vol-adaptive"
    what: "Volatility-regime boundary (points) for S2_VOL_ADAPTIVE: avg 14-bar range >= this => VOLATILE. Default constant _VOL_REGIME_PT = 8.0."
  S2_CHOPPINESS_GATE:
    category: s2
    group: "chop gate (1 of 2)"
    what: "S2 arming/display gate requiring choppiness_score < 70 (5-bar candle geometry; >=70 = choppy)."
    why: "DISABLED by Michael 2026-06-08. Inspector/build-status surface only — never vetoed a real fire."
    standing_decision: true
    ref: "CLAUDE.md §Chop Gates"
  S2_REQUIRE_COT_AMT:
    category: s2
    what: "Re-require footprint COT/AMT order-flow confirmation for S2 fires (S2 depends on S3)."
    why: "DISABLED 2026-06-08 (S2 ⟂ S3): S3 is muted/broken (S3_MUTE / I-11); requiring it would block all S2."
    standing_decision: true
    ref: "CLAUDE.md §S2 ⟂ S3"

  # ───────────────────────── S3 — footprint (suppressed pre-LIVE) ─────────────────────────
  S3_RELATIVE:
    category: s3
    what: "S3 footprint thresholds relative/ATR-scaled."
    why: "SHADOW calibration (Michael 31/5). (S3 itself is disabled — see FOOTPRINT_DISABLED.)"
  S3_MUTE:
    category: s3
    what: "Mute S3 fires (footprint signals computed but not routed)."
    why: "S3 muted pre-LIVE (I-11)."
  FOOTPRINT_DISABLED:
    category: s3
    what: "Fully disable S3 footprint processing AND writing (process_bar returns immediately) — not just fires."
    why: "Michael 2026-06-08: take S3 down until after LIVE; it has not ingested a bar all session (I-11)."
    standing_decision: true
    ref: "CLAUDE.md §S3 Footprint"

  # ───────────────────────── S4 — Woodies (ZLR / HFE / TLB / …) ─────────────────────────
  S4_EXTREME_TREND_RELABEL:
    category: s4
