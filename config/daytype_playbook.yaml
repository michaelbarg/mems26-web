# config/daytype_playbook.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth: PATTERN × DAY-TYPE trade management.
# Edit ONE pattern's block to change ONLY that pattern — no code change, git-tracked.
#
#   verdict:  FULL = trade normally · REDUCED = size-down (half) · SKIP = don't trade
#   require_with_trend: true  → on a TREND day, enter ONLY in the trend direction
#                               (live trend_state: LONG needs BLUE, SHORT needs RED)
#   group:    CONT (continuation) | REV (reversal)
#
# Stop/target NUMBERS are NOT duplicated here — they live in stop_anchors.yaml /
# targets.yaml. This file decides ENTER/SIZE/SKIP + direction discipline per day-type.
#
# GATED by env DAYTYPE_PLAYBOOK=1 (default OFF). When OFF the decision engine is a
# no-op (returns FULL for everything) → ZERO change to current firing behavior.
# Source: docs/research/PATTERN_DAYTYPE_PLAYBOOK_RESEARCH_2026-06-11.md (Part E matrix).
# ─────────────────────────────────────────────────────────────────────────────

version: 1
max_contracts: 3            # global cap — REDUCED resolves to ceil(max/2)

# How to MANAGE a kept trade, per day-type (entry/target style + runner).
daytype_style:
  Trend_Normal:    { target: movement,  runner: trail_chandelier, stop_be_early: false, note: "ride the pullback steps with-trend; let runners run" }
  Trend_DD:        { target: movement,  runner: trail,            note: "CONT after mid-zone break" }
  Normal:          { target: location,  t1_anchor: POC,           t2_anchor: opposite_ib_edge, note: "fade VA edges: VAH->short / VAL->long" }
  Variation:       { target: location,  t1_anchor: half_extension, t2_anchor: one_ib,           note: "go WITH the IB expansion" }
  Neutral_Center:  { target: location,  t1_anchor: vwap_poc,      runner: none, note: "fade edges to center, then exit" }
  Neutral_Extreme: { target: location,  t1_anchor: POC,           t2_anchor: opposite_edge }
  Nontrend:        { action: SKIP,                                note: "no participants — skip all (already NT NO_TRADE)" }

# Per-pattern gate. Columns = the 7 day-types. (E=FULL, D=REDUCED, S=SKIP in the spec.)
patterns:
  # ── Continuation (S4 Woodies + S2 INITIATIVE) ──
  ZLR:        { group: CONT, cells: { Trend_Normal: FULL,    Trend_DD: FULL,    Normal: REDUCED, Variation: FULL,    Neutral_Center: SKIP, Neutral_Extreme: SKIP,    Nontrend: SKIP } }
  TLB:        { group: CONT, cells: { Trend_Normal: FULL,    Trend_DD: FULL,    Normal: REDUCED, Variation: FULL,    Neutral_Center: SKIP, Neutral_Extreme: REDUCED, Nontrend: SKIP } }
  TT:         { group: CONT, cells: { Trend_Normal: REDUCED, Trend_DD: REDUCED, Normal: REDUCED, Variation: REDUCED, Neutral_Center: SKIP, Neutral_Extreme: SKIP,    Nontrend: SKIP } }
  GB100:      { group: CONT, cells: { Trend_Normal: REDUCED, Trend_DD: REDUCED, Normal: REDUCED, Variation: REDUCED, Neutral_Center: SKIP, Neutral_Extreme: SKIP,    Nontrend: SKIP } }
  HTLB:       { group: CONT, cells: { Trend_Normal: FULL,    Trend_DD: FULL,    Normal: REDUCED, Variation: FULL,    Neutral_Center: REDUCED, Neutral_Extreme: REDUCED, Nontrend: SKIP } }
  INITIATIVE: { group: CONT, cells: { Trend_Normal: FULL,    Trend_DD: FULL,    Normal: REDUCED, Variation: FULL,    Neutral_Center: SKIP, Neutral_Extreme: SKIP,    Nontrend: SKIP } }
  FLAGS:      { group: CONT, cells: { Trend_Normal: FULL,    Trend_DD: FULL,    Normal: REDUCED, Variation: FULL,    Neutral_Center: SKIP, Neutral_Extreme: REDUCED, Nontrend: SKIP } }

  # ── Reversal (S4 Woodies + S2 REACTIVE) — SKIP on trend days per spec ──
  VEGAS:      { group: REV, cells: { Trend_Normal: SKIP, Trend_DD: SKIP, Normal: FULL,    Variation: REDUCED, Neutral_Center: FULL, Neutral_Extreme: FULL, Nontrend: SKIP } }
  GHOST:      { group: REV, cells: { Trend_Normal: SKIP, Trend_DD: SKIP, Normal: FULL,    Variation: REDUCED, Neutral_Center: FULL, Neutral_Extreme: FULL, Nontrend: SKIP } }
  FAMIR:      { group: REV, cells: { Trend_Normal: SKIP, Trend_DD: SKIP, Normal: FULL,    Variation: REDUCED, Neutral_Center: FULL, Neutral_Extreme: FULL, Nontrend: SKIP } }
  HFE:        { group: REV, cells: { Trend_Normal: SKIP, Trend_DD: SKIP, Normal: REDUCED, Variation: REDUCED, Neutral_Center: FULL, Neutral_Extreme: FULL, Nontrend: SKIP } }
  DBDT:       { group: REV, cells: { Trend_Normal: SKIP, Trend_DD: REDUCED, Normal: FULL,  Variation: REDUCED, Neutral_Center: FULL, Neutral_Extreme: FULL, Nontrend: SKIP } }

  # REACTIVE/HnS: allowed on trend days but ONLY with-trend (require_with_trend).
  REACTIVE:   { group: REV, require_with_trend: true, cells: { Trend_Normal: FULL,    Trend_DD: FULL,    Normal: FULL, Variation: FULL, Neutral_Center: FULL, Neutral_Extreme: FULL, Nontrend: SKIP } }
  HNS:        { group: REV, require_with_trend: true, cells: { Trend_Normal: REDUCED, Trend_DD: REDUCED, Normal: FULL, Variation: FULL, Neutral_Center: FULL, Neutral_Extreme: FULL, Nontrend: SKIP } }
