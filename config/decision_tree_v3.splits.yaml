    candidate: "n=112 · 58% · +1,861$"
    day_total: "58 sessions: baseline Σ+1,220.00$ → Σ+1,321.25$ · Δ +101.25$ gross / ≈ +83$ net of +7 round-trips · better 5 / worse 2 / same 51 · by month Jun +45 · Jul +104 · Aug +86 · Sep −134"
    downstream: "8 new trades (HTLB, GB100, GHOST, SCALE_IN, INITIATIVE_LONG, GHOST, CONFLUENCE_RI_ZLR, INITIATIVE_SHORT): 6 wins / 2 stops; 17.07 a losing REACTIVE_LONG displaced (+45$)"
    verdict: "POSITIVE but under-sampled (8 < 15) ⇒ entered the tree as a SHADOW leaf `auction_B_trend_break` with measured: — TAKE when the replay holds ≥ 15 trades and Σ ≥ 0"
  - id: V3b
    date: 2026-09-25
    path: "as V2 with day_type=Trend_Normal|Trend_DD|Variation|Normal_Variation"
    question: "V2 plus a first hour that reads Variation"
    variant: harness_out/t480/tree_v3b.yaml
    candidate: "Trend n=112 +1,861$ · Variation n=32 · 62% · +937$"
    day_total: "58 sessions: Σ+1,306.25$ · Δ +86.25$ gross / ≈ +65$ net of +8 round-trips · better 5 / worse 2 / same 51 — i.e. the Variation part alone is Δ −15$ (14.07 −54$, 08.09 −95$ vs V2)"
    verdict: "REFUTED for the Variation label — V2 alone stands"
