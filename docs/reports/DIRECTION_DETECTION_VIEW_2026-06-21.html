        color:COL[b.dir], wickColor:COL[b.dir], borderColor:COL[b.dir]})));
  cvd.setData(o.bars.filter(b=>b.cvd!=null).map(b=>({time:b.t, value:b.cvd})));

  priceLines.forEach(l=>{try{candle.removePriceLine(l)}catch(e){}}); priceLines=[];
  const levels=[["IBH",o.ib_high,"#e3b341",LWC.LineStyle.Dashed],
                ["IBL",o.ib_low,"#e3b341",LWC.LineStyle.Dashed],
                ["POC",o.poc,"#58a6ff",LWC.LineStyle.Solid],
                ["VAH",o.vah,"#8b949e",LWC.LineStyle.Dotted],
                ["VAL",o.val,"#8b949e",LWC.LineStyle.Dotted]];
  const byPrice={};
  levels.forEach(([t,p,c,s])=>{ if(p==null) return; const k=p.toFixed(2);
     if(!byPrice[k]) byPrice[k]={titles:[],c,s,p}; byPrice[k].titles.push(t); });
  Object.values(byPrice).forEach(g=>{
     priceLines.push(candle.createPriceLine({price:g.p, color:g.c, lineWidth:1, lineStyle:g.s,
        axisLabelVisible:true, title:g.titles.join("/")+" "+g.p})); });

  const m=[];
  (o.trades||[]).forEach(t=>{ m.push({time:t.t,
        position: t.dir==="LONG"?"belowBar":"aboveBar",
        color: (t.pnl!=null && t.pnl>=0)?"#2ea043":"#da3633",
        shape: t.dir==="LONG"?"arrowUp":"arrowDown", text:""}); });
  (o.bars||[]).forEach(b=>{ if(b.trans) m.push({time:b.t, position:"aboveBar", color:COL[b.dir], shape:"circle", text:""}); });
  m.sort((a,b)=>a.time-b.time);
  // de-dup identical (time,shape,position)
  const seen=new Set(); const mm=m.filter(x=>{const k=x.time+x.shape+x.position; if(seen.has(k))return false; seen.add(k); return true;});
  if(markersP) markersP.setMarkers(mm); else markersP = LWC.createSeriesMarkers(candle, mm);

  chart.timeScale().fitContent();
  const u=o.bars.filter(b=>b.dir==="UP").length, d=o.bars.filter(b=>b.dir==="DOWN").length;
  document.getElementById("hdr").innerHTML = day+" — <b>"+o.day_type+"</b> · IB "+o.ib_low+"–"+o.ib_high+" · POC "+o.poc
     + " · UP "+u+" / DOWN "+d + " · עסקאות "+(o.trades||[]).length
     + (o.roll?' · <span style="color:#d29922">roll-day (איכות-נתונים)</span>':"")
     + (o.ib_high==null?' · <span style="color:#d29922">אין CASH-TPO ביום זה</span>':"");
  document.getElementById("note").textContent =
     "פרוטוטייפ של זיהוי-הכיוון (CVD+מיקום+מצב-פריצה). RTH 08:30–15:00 CT. הצבע של כל נר = הכיוון שזוהה. ה-resolver החי עוד לא נבנה — זו תצוגת-אימות.";
}

const sel=document.getElementById("daySel");
DAYS.forEach(d=>{ const op=document.createElement("option"); op.value=d; op.textContent=d+"  ("+(DATA[d].day_type||"?")+")"; sel.appendChild(op); });
sel.value = DAYS.includes("2026-06-11") ? "2026-06-11" : DAYS[0];
sel.onchange = ()=>load(sel.value);
load(sel.value);
window.addEventListener("resize", ()=>chart.applyOptions({}));
</script></body></html>
