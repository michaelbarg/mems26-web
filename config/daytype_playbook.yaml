# config/daytype_playbook.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth: PATTERN × DAY-TYPE trade management.
# Edit ONE pattern's block to change ONLY that pattern — no code change, git-tracked.
#
#   verdict:  FULL = trade normally · REDUCED = size-down (half) · SKIP = don't trade
#   require_with_trend: true  → on a TREND day, enter ONLY in the trend direction
#                               (live trend_state: LONG needs BLUE, SHORT needs RED)
#   group:    CONT (continuation) | REV (reversal)
#
# Stop/target NUMBERS are NOT duplicated here — they live in stop_anchors.yaml /
# targets.yaml. This file decides ENTER/SIZE/SKIP + direction discipline per day-type.
#
# GATED by env DAYTYPE_PLAYBOOK=1 (default OFF). When OFF the decision engine is a
# no-op (returns FULL for everything) → ZERO change to current firing behavior.
# Source: docs/research/PATTERN_DAYTYPE_PLAYBOOK_RESEARCH_2026-06-11.md (Part E matrix).
#
# ── RULING 2026-08-12 (Michael, morning directive = the ruling; CC_WORKORDER F4) ──
# The 48-session audits (SYSTEM4_FULL_AUDIT_2026-08-11 §7-§9 + SYSTEM2 audit)
# found this matrix INVERTED vs the evidence, so the S4 cells were flipped:
#   GB100  REDUCED→FULL  on Trend_*/Normal/Variation — the ONLY pattern positive
#          in live (+$167.50, 3W-0L), shadow (+$530.20, 82%) AND 48-session replay
#          (+$2,282.50 net, both halves, all 3 months, every stop 4-12pt, to 4
#          ticks slippage). Neutral_*/Nontrend stay SKIP.
#   ZLR    FULL→REDUCED (+ SKIP on Normal) — 65% of S4 signal volume, negative
#          everywhere: live −$270 (39%), shadow −$849 (51%), replay −$134; no
#          slice survives out-of-sample. Neutral_* stay SKIP.
#   FAMIR  → SKIP everywhere (replay −$1,607 / 38%; shadow −$660; 0 live wins).
#   VEGAS  → SKIP everywhere (replay −$1,015 / 40%; shadow −$276.50).
#   GHOST  FULL→REDUCED on Normal; Neutral_* FULL→SKIP (live 0W-3L −$177.50;
#          allowed S4 day-types per the ruling: Trend_*/Variation/Normal only).
# Patterns NOT named in the ruling (TLB/TT/HTLB/DBDT/CONFLUENCE/S2 rows) are
# untouched — HTLB/TLB measure positive; changing them needs its own ruling.
# ─────────────────────────────────────────────────────────────────────────────

version: 1
max_contracts: 3            # global cap — REDUCED resolves to ceil(max/2)

# How to MANAGE a kept trade, per day-type (entry/target style + runner).
# §1 table from S1_TRADE_MANAGEMENT_3CONTRACTS.md (Michael 2026-06-20).
#
# Each day-type defines:
#   target:       movement (R-based) | location (structural levels)
#   ref_points:   the structural levels that define "where am I?"
#   bias:         what direction is allowed at each zone
#   c1/c2/c3:     target levels for the 3-contract bracket
#   contracts:    how many contracts (overrides targets_table when structural active)
#   runner:       trail style for C3 (trail/trail_chandelier/none)
#
daytype_style:
  Nontrend:
    target: location
    action: SKIP
    ref_points: [IBH, IBL, POC]
    bias: "skip (scalp-only: fade edge→POC, 1 contract max)"
    c1: POC
    contracts: 1
    runner: none
    note: "no participants — skip all or scalp edge→POC"

  Nonconviction:
    target: location
    action: SKIP
    ref_points: []
    bias: "stand aside — no OTF footprints (Dalton pp.300-302); P1-8"
    c1: null
    contracts: 0
  Normal:
    target: location
    fade_edges: true
    ref_points: [VAH, POC, VAL, IBH, IBL]
    bias: "VAL→LONG · VAH→SHORT (fade to value)"
    c1: IB_center
    c2: opposite_VA_edge
    c3: opposite_IB_edge
    contracts: 3
    time_stop_minutes: null
    runner: trail
    note: "fade VA edges: SHORT only near VAH, LONG only near VAL"

  Variation:
    target: location
    fade_edges: false
    ref_points: [broken_IB_edge, measured_move, PDH, PDL]
    bias: "WITH the IB expansion only; enter on pullback to broken edge"
    c1: half_extension
    c2: one_ib_extension
    c3: measured_move
    contracts: 3
    time_stop_minutes: null
    runner: trail
    note: "go WITH the IB expansion (continuation, not fade)"

  Neutral_Center:
    target: location
    fade_edges: true
    ref_points: [IBH, IBL, POC]
    bias: "fade both edges → center (2-sided)"
    c1: POC
    c2: opposite_IB_edge
    contracts: 2
    time_stop_minutes: null
    runner: none
    note: "fade edges to center, then exit — no runner"

  Neutral_Extreme:
    target: location
    fade_edges: true
    ref_points: [VA_edges, POC, winning_edge]
    bias: "fade VA edges; hold toward winning extreme"
    c1: POC
    c2: opposite_VA_edge
    c3: winning_extreme
    contracts: 3
    time_stop_minutes: null
    runner: trail
    note: "fade VA edges to POC, trail runner toward winning extreme"

  Trend_DD:
    target: movement
    ref_points: [single_print, distribution_POC, PDH, PDL]
    bias: "WITH the breakout from single-print/distribution"
    c1: dist2_POC
    c2: measured_move
    c3: trail_behind_structure
    contracts: 3
    time_stop_minutes: null
    runner: trail
    note: "CONT after single-print break; trail behind structure"

  Trend_Normal:
    target: movement
    ref_points: [period_extreme, open, PDH, PDL]
    bias: "WITH the trend from open; add on shallow pullbacks"
    c1: remote_checkpoint
    c2: additional_measured
    c3: hold_to_close
    contracts: 3
    runner: trail_chandelier
    stop_be_early: false
    note: "ride the pullback steps with-trend; let runners run to close"

# ── Opening Stance (פסיקות מייקל 2+4, 2026-07-22; Dalton mapping approved) ──
# Maps opening-type to a trading stance for the opening window. Consumed by
# opening_panel (display) and opening_type_gate (gate logic). Read-only from here.
#
# DIRECTIONAL = with-drive only; approved reversal-at-open = early entry
# REVERSAL    = counter-to-initial-move trade
# NO_EDGE     = stand aside, wait for structure
opening_stance:
  OPEN_DRIVE:             DIRECTIONAL
  OPEN_TEST_DRIVE:        DIRECTIONAL
  OPEN_REJECTION_REVERSE: REVERSAL
  OPEN_AUCTION_IN:        NO_EDGE
  OPEN_AUCTION_OUT:       NO_EDGE

# Per-pattern gate. Columns = the 7 day-types. (E=FULL, D=REDUCED, S=SKIP in the spec.)
patterns:
  # ── Continuation (S4 Woodies + S2 INITIATIVE) ──
  # ZLR inverted 2026-08-12 (ruling above): FULL→REDUCED, Normal→SKIP.
  # 27.08 (פסיקת-מייקל "תבדוק אילו דגלים הורסים ותבטל — לא רק להיום"): Normal SKIP→REDUCED.
  # ראיה: 27.08 17:46 ZLR-LONG @7728.75 conform נחסם על הרגל של +40 נק' (הפרסום הוחזק
  # על Normal); באותו יום ZLR conform ב-17:15 שילם +$105. היסטורית ZLR×conform +$1,826/111.
  ZLR:        { group: CONT, cells: { Trend_Normal: REDUCED, Trend_DD: REDUCED, Normal: REDUCED, Variation: REDUCED, Neutral_Center: SKIP, Neutral_Extreme: SKIP,    Nontrend: SKIP, Nonconviction: SKIP } }
  TLB:        { group: CONT, cells: { Trend_Normal: FULL,    Trend_DD: FULL,    Normal: REDUCED, Variation: FULL,    Neutral_Center: SKIP, Neutral_Extreme: REDUCED, Nontrend: SKIP, Nonconviction: SKIP } }
  TT:         { group: CONT, cells: { Trend_Normal: REDUCED, Trend_DD: REDUCED, Normal: REDUCED, Variation: REDUCED, Neutral_Center: SKIP, Neutral_Extreme: SKIP,    Nontrend: SKIP, Nonconviction: SKIP } }
  # GB100 inverted 2026-08-12 (ruling above): REDUCED→FULL on the 4 allowed day-types.
  GB100:      { group: CONT, cells: { Trend_Normal: FULL,    Trend_DD: FULL,    Normal: FULL,    Variation: FULL,    Neutral_Center: SKIP, Neutral_Extreme: SKIP,    Nontrend: SKIP, Nonconviction: SKIP } }
  # HTLB moved to reversal section below (HTLB = reversal, not continuation)
  INITIATIVE: { group: CONT, cells: { Trend_Normal: FULL,    Trend_DD: FULL,    Normal: REDUCED, Variation: FULL,    Neutral_Center: SKIP, Neutral_Extreme: SKIP,    Nontrend: SKIP, Nonconviction: SKIP } }
  # S2×S4 combined pattern (CONFLUENCE_RI_ZLR_V1, default OFF — SHADOW-only V1).
  # Cells per spec docs/handoff/CONFLUENCE_PATTERN_SPEC_2026-07-17.md §1.4:
  # Neutral/Nontrend = SKIP (case D — the only full dual-route measured — failed
  # on a Neutral evening and was rightly blocked; the block SAVED a loss).
  CONFLUENCE_RI_ZLR: { group: CONT, require_with_trend: true, cells: { Trend_Normal: FULL, Trend_DD: FULL, Normal: FULL, Variation: FULL, Neutral_Center: SKIP, Neutral_Extreme: SKIP, Nontrend: SKIP, Nonconviction: SKIP } }
  FLAGS:      { group: CONT, cells: { Trend_Normal: FULL,    Trend_DD: FULL,    Normal: REDUCED, Variation: FULL,    Neutral_Center: SKIP, Neutral_Extreme: REDUCED, Nontrend: SKIP, Nonconviction: SKIP } }

  # ── Reversal (S4 Woodies + S2 REACTIVE) — SKIP on trend days per spec ──
  HTLB:       { group: REV, cells: { Trend_Normal: FULL,    Trend_DD: FULL,    Normal: REDUCED, Variation: FULL,    Neutral_Center: REDUCED, Neutral_Extreme: REDUCED, Nontrend: SKIP, Nonconviction: SKIP } }
  # VEGAS/FAMIR → SKIP everywhere · GHOST capped at REDUCED, Neutral shut (ruling 2026-08-12 above).
  VEGAS:      { group: REV, cells: { Trend_Normal: SKIP, Trend_DD: SKIP, Normal: SKIP,    Variation: SKIP,    Neutral_Center: SKIP, Neutral_Extreme: SKIP, Nontrend: SKIP, Nonconviction: SKIP } }
  GHOST:      { group: REV, cells: { Trend_Normal: SKIP, Trend_DD: SKIP, Normal: REDUCED, Variation: REDUCED, Neutral_Center: SKIP, Neutral_Extreme: SKIP, Nontrend: SKIP, Nonconviction: SKIP } }
  FAMIR:      { group: REV, cells: { Trend_Normal: SKIP, Trend_DD: SKIP, Normal: SKIP,    Variation: SKIP,    Neutral_Center: SKIP, Neutral_Extreme: SKIP, Nontrend: SKIP, Nonconviction: SKIP } }
  # HFE:     DISABLED (not Michael's pattern, −$2,987; flag HFE_DISABLED)
  DBDT:       { group: REV, cells: { Trend_Normal: SKIP, Trend_DD: REDUCED, Normal: FULL,  Variation: REDUCED, Neutral_Center: FULL, Neutral_Extreme: FULL, Nontrend: SKIP, Nonconviction: SKIP } }

  # REACTIVE/HnS: allowed on trend days but ONLY with-trend (require_with_trend).
  REACTIVE:   { group: REV, require_with_trend: true, cells: { Trend_Normal: FULL,    Trend_DD: FULL,    Normal: FULL, Variation: FULL, Neutral_Center: FULL, Neutral_Extreme: FULL, Nontrend: SKIP, Nonconviction: SKIP } }
  HNS:        { group: REV, require_with_trend: true, cells: { Trend_Normal: REDUCED, Trend_DD: REDUCED, Normal: FULL, Variation: FULL, Neutral_Center: FULL, Neutral_Extreme: FULL, Nontrend: SKIP, Nonconviction: SKIP } }
