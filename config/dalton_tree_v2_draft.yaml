# T-392: Decision Tree v2 — draft YAML
#
# Existing hardcoded rules expressed as expr: conditions.
# This tree is NOT connected to the firing path — shadow comparison only.
# First matching rule wins.  No match → stand_down.
#
# Fields available in the vector namespace (from SituationVector + gateway):
#   day_type, phase, zone, direction, extension, extension_pts,
#   opening_type, ib_locked, bars_since_high, bars_since_low,
#   entry_kind, classification, vol_ratio, atr_causal, dir_hint, prior_zone
#
# Rule schema:
#   id:        unique string
#   phase:     list of phases this rule applies to (omit = all phases)
#   condition: "expr: <safe expression>"
#   decision:  allow | block | stand_down
#   source:    originating task
#   measured:  measurement data or UNMEASURED
#   note:      optional explanation

rules:

  # ── T-319b: location gate, phase C Normal/Neutral ──────────────────────
  - id: t319b_normal_location_long
    phase: [C]
    condition: "expr: day_type in ['Normal','Neutral_Center','Neutral_Extreme'] and zone not in ['near_val','below_value'] and direction == 'LONG'"
    decision: block
    source: T-319b
    measured: UNMEASURED
    note: "LONG must come from near_val or below_value in Normal/Neutral phase C"

  - id: t319b_normal_location_short
    phase: [C]
    condition: "expr: day_type in ['Normal','Neutral_Center','Neutral_Extreme'] and zone not in ['near_vah','above_value'] and direction == 'SHORT'"
    decision: block
    source: T-319b
    measured: UNMEASURED
    note: "SHORT must come from near_vah or above_value in Normal/Neutral phase C"

  # ── T-329: FAILED_EXTENSION / CEILING_FLIP exempt ──────────────────────
  - id: t329_failed_extension
    phase: []
    condition: "expr: classification_prefix in ['CEILING_FLIP', 'FAILED_EXTEN']"
    decision: allow
    source: T-329
    measured: UNMEASURED
    note: >
      T-392b: rewritten from placeholder. Uses classification_prefix (first
      12 chars) added to SituationVector. Matches CEILING_FLIP* and
      FAILED_EXTENSION* setups that are exempt from location gates.

  # ── T-355: phase-B location gate ───────────────────────────────────────
  - id: t355_phase_b_location
    phase: [B]
    condition: "expr: phase == 'B'"
    decision: allow_if_location_ok
    source: T-355
    measured: UNMEASURED
    note: >
      PLACEHOLDER (T-392b): Phase-B location check requires dynamic computation
      of price vs prior_vah/prior_val + session extremes + tolerance band.
      Cannot be expressed as a single expr: condition because it needs
      runtime edge = max(prior_vah, session_high) etc. The real multi-step
      check lives in trading_gateway.py (T-355 block). This row marks the
      slot; converting it requires extending the evaluator with computed fields.

  # ── T-365: opening before day-type, phases A/B ─────────────────────────
  - id: t365_opening_before_daytype
    phase: [A, B]
    condition: "expr: phase in ['A', 'B']"
    decision: skip_no_label_gate
    source: T-365
    measured: UNMEASURED
    note: "In phases A/B the day-type label is not yet available — skip label-dependent gates"

  # ── T-367 Rule A: Variation with extension allow ───────────────────────
  # MUST come before Rule B so that extension entries from mid_value are
  # allowed (deliberate diff from current code — see GHOST SHORT note).
  # T-392b/F5c: narrowed scope — direction must match extension, entry_kind constrained.
  - id: t367_rule_a_extension_allow
    condition: "expr: day_type in ['Variation','Normal_Variation'] and extension != 'none' and ((extension == 'down' and direction == 'SHORT') or (extension == 'up' and direction == 'LONG')) and entry_kind in ['BREAK','PULLBACK']"
    decision: allow
    source: T-367
    measured: UNMEASURED
    note: "direction matches extension + entry_kind in BREAK/PULLBACK — allows mid_value WITH extension"

  # T-392b/F5c: counter-extension on Variation allowed only at extreme zones
  - id: t367_rule_a_counter_extension
    condition: "expr: day_type in ['Variation','Normal_Variation'] and extension != 'none' and ((extension == 'up' and direction == 'SHORT') or (extension == 'down' and direction == 'LONG')) and zone in ['above_value','below_value']"
    decision: allow
    source: T-392b
    measured: UNMEASURED
    note: "Counter-extension entries allowed only at extreme zones (above_value/below_value)"

  # ── T-367 Rule B: Variation mid_value block ────────────────────────────
  - id: t367_rule_b_midvalue_block
    condition: "expr: day_type in ['Variation','Normal_Variation'] and zone == 'mid_value'"
    decision: block
    source: T-367
    measured: UNMEASURED
    note: "Mid-value entries blocked on Variation days (only when no extension — Rule A catches extension first)"

  # ── GHOST SHORT deliberate diff (15.09 19:10) ─────────────────────────
  # The 15.09 19:10 SHORT from mid_value was blocked by T-367 Rule B
  # (variation_mid_value) in the current code.  The tree v2 DELIBERATELY
  # says 'allow' here: the intent is to capture entries with the extension
  # even from mid_value when going WITH the trend.  This is the only
  # designed divergence between tree-v2 and current gates for known setups.
  #
  # This is NOT a separate rule — it's a documentation note explaining
  # that t367_rule_a_extension_allow fires BEFORE t367_rule_b_midvalue_block
  # for setups where extension != 'none', producing the desired 'allow'.

  # ── T-397: Phase D runner on trend continuation ────────────────────────
  - id: t397_phase_d_trend_runner
    phase: [D]
    condition: "expr: phase == 'D' and day_type in ['Trend_Normal','Trend_DD','Neutral_Extreme'] and ((extension == 'down' and direction == 'SHORT') or (extension == 'up' and direction == 'LONG'))"
    decision: allow
    runner: true
    source: T-397
    measured: UNMEASURED
    note: "16.09 lesson: Phase D trend continuation with extension — runner allowed"

  # ── T-392c: Volume break at IB ────────────────────────────────────────
  - id: t392c_volume_break
    condition: "expr: entry_kind == 'BREAK' and vol_ratio >= 3.0 and ((extension == 'down' and direction == 'SHORT') or (extension == 'up' and direction == 'LONG') or extension == 'none') and zone in ['near_val','below_value','near_vah','above_value']"
    decision: allow
    source: T-392c
    measured: UNMEASURED
    note: "Volume break (vol_ratio >= 3.0) at IB extreme zones. vol_ratio None -> comparison fails -> False (fail-closed)"

  # ── FRESH_EXTREME (T-366) ──────────────────────────────────────────────
  # Measured negative, Michael turned off.  NO ROW in tree v2.
