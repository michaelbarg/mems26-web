mds_version: "1.0.0"
created: "2026-05-02"
status: "skeleton — full ranges in MDS-V1.0.1"
architecture: "Option C — DB outcome direct, trade mgmt deferred to Phase 3.5"

# Baseline V1 reference (used by sanity test)
baselines:
  v1_production:
    threshold: 50
    vegas_weight: 30
    tpo_weight: 25
    fvg_weight: 25
    footprint_weight: 20
    footprint_logic: "weighted"
    day_filter: "all_days"
    direction_filter: "both"
    skip_overextended: false        # V1 doesn't filter
    duration_max_minutes: 720       # effectively no cap
    duration_penalty_factor: 0.0    # no penalty

# Dimensions for sweep (skeleton — full ranges in MDS-V1.0.1)
continuous:
  threshold:
    range: [25, 75]
    description: "Score gate for execution"
  vegas_weight:
    range: [0, 45]
    description: "Vegas component max contribution"
  tpo_weight:
    range: [5, 40]
    description: "TPO position component max"
  fvg_weight:
    range: [5, 40]
    description: "FVG component max"

categorical:
  footprint_logic:
    values: ["weighted", "veto", "off"]
    description: "How footprint contributes"
  day_filter:
    values: ["all_days", "skip_DEVELOPING", "skip_DEVELOPING_NEUTRAL", "TREND_only"]
    description: "Which day types to allow"
  direction_filter:
    values: ["both", "SHORT_only"]
    description: "Direction restriction"
  skip_overextended:
    values: [false, true]
    description: |
      When true: vetoes overextended setups (LONG with vwap_side=above,
      SHORT with vwap_side=below). Only filters setups with non-null
      vwap_side (~3.4% of dataset). Setups with NULL vwap_side pass through.
      Finding: Score 90+ are 96.3% overextended.
  duration_max_minutes:
    values: [720]
    note: "FIXED — not swept in V1.0 due to fixed 60min measurement window"
    future: "V1.1: JOIN setups table for real first_detected→closed duration"
  duration_penalty_factor:
    values: [0.0]
    note: "FIXED — inert until duration becomes variable in V1.1"

# Deferred to Phase 3.5 (bar-by-bar simulator)
deferred:
  - stop_type        # fixed_5pt / structural_shadow
  - t2_cap_R         # T2 max distance in R units
  - c3_mode          # off / fixed_3R / vegas_trail_proxy

constraints:
  - "vegas_weight + tpo_weight + fvg_weight + 20 <= 105"
  - "vegas_weight + tpo_weight + fvg_weight + 20 >= 70"
