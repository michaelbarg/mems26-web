# Pattern×DayType T1 overrides — absolute points, NOT R-multiples.
# Michael ruling 2026-07-10, based on TP audit (MFE p25-p50 analysis, 276 trades).
# Applied in gateway after detector T1 but before structural targets.
# T2/T3 scale: T2 = T1×2, T3 = T1×3 (runner, capped by TP-1 clamp).
