    ref: "CC_OVERNIGHT_3FIXES_2026-07-23.md Phase 7 · RULED מייקל 07-24 12:20 · enabled cowork 07-24"
  OPENING_TYPE_SEEDS_S1_V1:
    category: s1
    what: "Seed S1 day-bias from opening-type classification in first 15min of RTH. Directional opens (OD/OTD/ORR) seed UP/DOWN; auctions = no seed. Escalation-only lock until IB."
    why: "ENABLED 07-24 (cowork, per Michael ruling 07-23 'שלושתם' #2). First 15min have no dir_bias (too few bars) and no expansion (IB not locked); opening signal strongest here. Escalation-only lock until IB. replay 07-23 → DOWN. 4 tests."
    status: enabled
    ref: "CC_OVERNIGHT_3FIXES_2026-07-23.md Phase 3 · RULED מייקל 07-23 'שלושתם' #2 · enabled cowork 07-24"
  EXTREME_CHASE_GUARD_V1:
    category: risk
    what: "Gateway gate: blocks CONT-family entries too close to session extreme (distance + pullback checks). Prevents chasing the low/high."
    why: "ENABLED 07-24 (cowork, per Michael ruling 07-23 'שלושתם' #1). 479+481 chased session low; this gate blocks both. @7466-with-pullback → ALLOW. Risk-reducing. 5 replay tests."
    status: enabled
    ref: "CC_OVERNIGHT_3FIXES_2026-07-23.md Phase 2 · RULED מייקל 07-23 'שלושתם' #1 · enabled cowork 07-24"
