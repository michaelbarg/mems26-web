# MEMS26 — Render Blueprint (Michael 2026-08-13: "אפליקציה נפרדת לפלאפון ברנדר"
# + "צריך רנדר נפרד למק-2")
#
# ONE service per trading machine, same code (render_mobile_relay/) — a
# display + emergency-command relay. NO database, NO trading, NO backend.
# Each Mac pushes its own snapshot every ~5s (scripts/mobile_relay.py via the
# com.mems26.mobile_relay LaunchAgent, RENDER_MOBILE_URL selects the target
# service) and polls /cmd/pending for FLATTEN/PAUSE/RESUME.
#
# Existing services:
#   mems26-mobile.onrender.com  ← מק-1 (created manually, LIVE — not managed
#                                  by this blueprint; leave it alone)
#   mems26-phone-mac2           ← מק-2 (THIS blueprint creates it)
#
# Deploy mac2 service (Michael, one time):
#   Render dashboard → New → Blueprint → repo michaelbarg/mems26-web → Apply.
#   When prompted, paste MOBILE_ACCESS_KEY and MOBILE_PUSH_KEY — the SAME
#   values as the Mac's .env (sent via Pushover).
#
# Link after deploy: https://mems26-phone-mac2.onrender.com/?key=<MOBILE_ACCESS_KEY>
#
# NOTE plan: free sleeps after idle (~50s cold start — annoying for
# emergencies). Upgrade to starter in the dashboard for always-on.
#
# DR for מק-1: if mems26-mobile ever dies, duplicate the service block below
# with name mems26-phone, deploy, and point mac-1's RENDER_MOBILE_URL at it.

services:
  - type: web
    name: mems26-phone-mac2
    runtime: python
    rootDir: render_mobile_relay
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: false  # trading repo pushes must NOT redeploy the phone app
    envVars:
      - key: MOBILE_ACCESS_KEY
        sync: false
      - key: MOBILE_PUSH_KEY
        sync: false
